<!DOCTYPE html>
<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>請求書ツール | 太豊建設アプリ</title>
<style>
  :root {
    --bg: #F6F5FB; --surface: #FFFFFF; --primary: #6C47FF; --primary-dark: #5636D9;
    --primary-soft: #EFEAFF; --text: #1E1B2E; --text-secondary: #6B6580; --text-tertiary: #9C97AE;
    --border: #E7E4F0; --danger: #F0525C; --success: #10B981; --warn: #F59E0B; --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(30,27,46,0.06); --shadow-md: 0 8px 24px rgba(30,27,46,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Yu Gothic','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }

  .shell { max-width: 1180px; margin: 0 auto; padding: 20px 20px 60px; }
  .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
  .page-header__title { font-weight: 900; font-size: 20px; }
  .page-sub { font-size: 12.5px; color: var(--text-tertiary); margin: 0 0 18px; }

  .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 18px 20px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 14px; color: var(--text-secondary); }

  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration:none; }
  .btn:hover { background: var(--primary-soft); }
  .btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn--primary:hover { background: var(--primary-dark); }
  .btn--ghost { background: transparent; }
  .btn[disabled] { opacity: .5; cursor: default; }

  .note { font-size: 12.5px; color: var(--text-secondary); background: #FFF8EC; border: 1px solid #F5E3BE; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; line-height: 1.7; }
  .warn-box { background: #FFF7E6; border: 1px solid #F5D68A; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; color: #7A5B06; margin-bottom: 14px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
  .field textarea { min-height: 60px; resize: vertical; }
  .field-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field-row .field { flex: 1; min-width: 160px; }
  .hint { font-size: 11px; color: var(--text-tertiary); font-weight: 400; }

  /* ===== 請求書プレビュー(印刷対象) ===== */
  .doc { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 34px 38px; position: relative; width: 297mm; max-width: 100%; box-sizing: border-box; margin: 0 auto; }

  /* ===== 御見積書(⑪見積・実行予算Pro)と同じ表紙レイアウト。御請求書はこの書式をそのまま流用する ===== */
  .pq-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; font-size: 9.5pt; }
  .pq-title-wrap { text-align: center; margin: 0 0 5px; }
  .pq-title { display: inline-block; font-size: 20pt; font-weight: 700; letter-spacing: .5em; border-bottom: 3px double #000; padding: 0 16px 5px; }
  .pq-left { display: flex; flex-direction: column; }
  .pq-co { text-align: left; font-size: 9.5pt; line-height: 1.4; margin-right: 48px; position: relative; }
  .pq-co-line { position: relative; z-index: 2; }
  .pq-co .name { font-size: 14.5pt; font-weight: 700; }
  .pq-client { font-size: 13pt; font-weight: 700; text-decoration: underline; margin: 6px 0 0; }
  .pq-mid { display: flex; justify-content: space-between; align-items: flex-end; margin: 5px 0 5px; }
  .pq-amount-col { width: 58%; }
  .pq-amount-box { display: inline-block; white-space: nowrap; border-bottom: 2px solid #000; padding: 4px 26px 6px 0; }
  .pq-amount-box .lbl { font-size: 11pt; }
  .pq-amount-box .val { font-size: 16pt; font-weight: 700; letter-spacing: .05em; }
  .pq-kojimei-wrap { margin-top: 6px; }
  .pq-kojimei { font-size: 11pt; font-weight: 700; display: inline-block; border-bottom: 1px solid #000; padding-bottom: 2px; }
  .pq-meta-col { width: 40%; margin-right: -120px; }
  .pq-meta { display: flex; flex-direction: column; gap: 2px; font-size: 9pt; }
  .pq-meta .bank-ttl { font-weight: 700; margin-bottom: 1px; }
  .pq-meta .bank-line { line-height: 1.5; }
  .pq-meta .bank-kana { margin-top: 2px; color: var(--text-secondary); }
  table.pq-table { width: 100%; border-collapse: collapse; margin-top: 4px; color: var(--text); }
  table.pq-table th, table.pq-table td { border: 1px solid #333; padding: 1.5px 6px; font-size: 8.5pt; }
  table.pq-table th { background: #eee; color: #333; text-align: center; }
  table.pq-table td.num { text-align: right; }
  table.pq-table td.l { text-align: left; }
  table.pq-table td.c { text-align: center; }
  table.pq-table tr.total-row td { font-weight: 700; text-align: right; }
  table.pq-table tr.total-row td.l { text-align: left; }

  .doc-stamp { position: absolute; opacity: .92; }
  .doc-stamp img { width: 100%; height: 100%; object-fit: contain; }
  .doc-stamp-ph { border: 1.4px dashed var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 9px; text-align: center; line-height: 1.3; opacity: .85; }
  body.stamp-edit [data-company-stamp] { pointer-events: auto; cursor: grab; outline: 2px dashed var(--primary); outline-offset: 4px; border-radius: 50%; touch-action: none; }
  body.stamp-edit [data-company-stamp]:active { cursor: grabbing; outline-color: var(--danger); }
  .stamp-edit-hint { display: none; align-items: center; gap: 10px; font-size: 12.5px; color: var(--primary-dark); background: var(--primary-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; flex-wrap: wrap; }
  body.stamp-edit .stamp-edit-hint { display: flex; }
  .doc-ref { margin-top: 14px; font-size: 11px; color: var(--text-tertiary); border-top: 1px dashed var(--border); padding-top: 8px; }
  .doc-remarks { margin-top: 12px; font-size: 11.5px; line-height: 1.7; white-space: pre-wrap; }
  .doc-issued-badge { position: absolute; top: 16px; right: 34px; font-size: 10.5px; font-weight: 700; color: var(--success); background: #E4F8EF; border: 1px solid #BEEBD4; padding: 3px 10px; border-radius: 999px; }

  /* ===== まとめ請求書(複数工事) ===== */
  .bundle-item-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .bundle-item-row:last-child { border-bottom: none; }
  .bundle-item-row .field { margin-bottom: 0; }
  .bundle-item-num { font-size: 12px; color: var(--text-tertiary); font-weight: 700; width: 20px; padding-bottom: 9px; }
  .bundle-total-line { text-align: right; font-size: 16px; font-weight: 900; padding: 10px 2px 2px; color: var(--primary-dark); }
  .bundle-page { page-break-before: always; }

  table.hist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.hist th, table.hist td { padding: 8px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  table.hist th { font-size: 11px; color: var(--text-tertiary); font-weight: 700; }
  .empty-note { font-size: 13px; color: var(--text-tertiary); padding: 8px 2px; }

  /* ===== 振込先(銀行口座)一覧編集 ===== */
  .bank-row-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: var(--bg); position: relative; }
  .bank-row-card .bank-row-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 15px; padding: 3px 6px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(30,27,46,.45); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 16px; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-md); }
  .modal__header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .modal__header h3 { margin: 0; font-size: 15px; }
  .modal__body { padding: 16px 18px; }
  .modal__footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); }
  .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-tertiary); }

  @media (max-width: 640px) {
    .doc { padding: 22px 18px; }
    .pq-top, .pq-mid { flex-direction: column; }
  }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .shell { max-width: none; padding: 0; }
    .doc { border: none; border-radius: 0; box-shadow: none; padding: 8mm; width: auto; max-width: none; margin: 0; }
    @page { size: A4 landscape; margin: 10mm; }
  }
</style>

<body>
<div class="shell">
  <div class="page-header no-print">
    <a class="btn no-print" href="11_見積実行予算Pro.html">← 見積・実行予算Proに戻る</a>
    <span class="page-header__title">🧾 請求書ツール</span>
    <button class="btn no-print" id="btnToggleBundleMode" style="margin-left:auto">📚 まとめ請求書(複数工事)を作る</button>
  </div>
  <p class="page-sub no-print">⑪見積・実行予算Proで作成した物件をもとに、請求書(書類)を作成します。サイドバーメニューには表示されません。</p>

  <div class="note no-print" id="normalNote">
    このツールは⑪見積・実行予算Proの画面にある「🧾 請求書を作る」ボタンから開きます。<br>
    一度「発行として保存」すると、その時点の金額・宛先で記録され、あとから元の見積を修正しても発行済みの請求書の内容は変わりません。
  </div>

  <div id="pickerArea"></div>
  <div id="mainArea"></div>
  <div id="historyArea"></div>

  <div class="note no-print" id="bundleNote" style="display:none">
    同じお客様(法人など)向けに、工事名が複数あり請求書が何枚にもなる場合に使います。工事ごとに⑪の物件を選んで金額を並べ、表紙(合計一覧)付きで1つの書類としてまとめて印刷・PDF保存できます。
  </div>
  <div id="bundleArea" style="display:none"></div>

  <div id="modalRoot"></div>

<script>
(function () {
  "use strict";

  // ===== データ保存(すべて⑪見積・実行予算Proと同じ taiho_app_data コレクションを共有) =====
  function storageGet(key) {
    return new Promise(function (resolve) {
      if (window.db) {
        window.db.collection("taiho_app_data").doc(key).get().then(function (doc) {
          resolve(doc.exists ? { value: doc.data().value } : null);
        }).catch(function () {
          try { var raw = window.localStorage.getItem(key); resolve(raw ? { value: raw } : null); }
          catch (e) { resolve(null); }
        });
      } else {
        try { var raw = window.localStorage.getItem(key); resolve(raw ? { value: raw } : null); }
        catch (e) { resolve(null); }
      }
    });
  }
  function storageSet(key, value) {
    return new Promise(function (resolve) {
      try { window.localStorage.setItem(key, value); } catch (e) {}
      if (window.db) {
        window.db.collection("taiho_app_data").doc(key).set({ value: value, updatedAt: Date.now() }).then(function () {
          resolve(true);
        }).catch(function () { resolve(true); });
      } else {
        resolve(true);
      }
    });
  }
  function readArr(key) { return storageGet(key).then(function (r) { try { var v = r && r.value ? JSON.parse(r.value) : null; return Array.isArray(v) ? v : []; } catch (e) { return []; } }); }
  function readObj(key) { return storageGet(key).then(function (r) { try { return r && r.value ? JSON.parse(r.value) : null; } catch (e) { return null; } }); }
  function readRaw(key) { return storageGet(key).then(function (r) { return (r && r.value != null) ? r.value : null; }); } // JSONエンコードされていない生の文字列値を読む(例: cep9_current)
  function writeArr(key, arr) { return storageSet(key, JSON.stringify(arr)); }
  function writeObj(key, obj) { return storageSet(key, JSON.stringify(obj)); }

  var PROJ_LIST_KEY = 'cep9_projects';              // ⑪見積・実行予算Pro 共有の物件一覧(読み取り専用)
  var PROJ_CUR_KEY = 'cep9_current';                // ⑪共有の「現在開いている物件」
  var CASE_PROJECTS_KEY = 'taiho_projects_v2';       // ①案件管理の案件一覧(参考表示用・読み取り専用)
  var INVOICE_DOCS_KEY = 'taiho_invoice_docs_v1';
  var INVOICE_BUNDLES_KEY = 'taiho_invoice_bundles_v1'; // まとめ請求書(複数工事)の保存先
  var COMPANY_BANKS_KEY = 'taiho_invoice_company_banks_v1'; // 振込先(複数口座に対応)
  var COMPANY_BANK_KANA_KEY = 'taiho_invoice_company_bank_kana_v1'; // 銀行振込用のカタカナ名義(会社全体・共通・自由編集)
  var COMPANY_STAMP_KEY = 'taiho_company_stamp_v1'; // ⑪見積・実行予算Proで登録した会社印影を共通で使う(読み取り専用)
  var STAMP_LAYOUT_KEY = 'taiho_invoice_stamp_layout_v1'; // 印影の位置・サイズ(このツールだけのローカル設定。画像・色は⑪と共通)
  var PX_PER_MM = 96 / 25.4;
  var STAMP_DEFAULT_TOP = -4, STAMP_DEFAULT_RIGHT = -6, STAMP_DEFAULT_MM = 17.5;

  function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function escNl(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML.replace(/\n/g, '<br>'); }
  function fmtYen(v) { v = Number(v) || 0; return (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString("ja-JP"); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function addDaysISO(iso, days) {
    var d = iso ? new Date(iso + "T00:00:00") : new Date();
    if (isNaN(d.getTime())) d = new Date();
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function fmtJp(iso) {
    if (!iso) return '';
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return '';
    var reiwa = d.getFullYear() - 2018;
    return "令和" + reiwa + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  // ===== ⑪見積・実行予算Proと同じ集計ロジック =====
  function ci(it) { var e = Math.round(it.qty * it.price); var d = (it.decOverride != null && it.decOverride !== '') ? Math.round(it.decOverride) : Math.round(e * it.rate); return { exec: e, dec: d, margin: d - e }; }
  function cc(cat) { var e = 0, d = 0, m = 0; cat.items.forEach(function (it) { var c = ci(it); e += c.exec; d += c.dec; m += c.margin; }); return { exec: e, dec: d, margin: m }; }
  function calcTotals(proj) {
    var d = 0;
    (proj.cats || []).forEach(function (cat) { d += cc(cat).dec; });
    var disc = (proj.cfg && proj.cfg.noDiscount) ? 0 : (proj.discount || 0);
    var ad = d - disc;
    var tax = Math.round(ad * 0.1);
    return { pre: d, disc: disc, ad: ad, tax: tax, total: ad + tax };
  }

  var projects = [];       // ⑪共有の物件一覧
  var caseProjects = [];   // ①案件管理の案件一覧(参考)
  var invoiceDocs = [];    // 発行済み請求書一覧
  var companyStamp = { img: null };
  var stampRenderSrc = null;
  var stampLayout = null;
  function getStampBox() {
    if (stampLayout && stampLayout.top != null && stampLayout.right != null && stampLayout.w != null && stampLayout.h != null) {
      return stampLayout;
    }
    var d = Math.round(STAMP_DEFAULT_MM * PX_PER_MM);
    return { top: STAMP_DEFAULT_TOP, right: STAMP_DEFAULT_RIGHT, w: d, h: d };
  }
  function hexToRgba(hex, alpha) {
    var h = (hex || '#b3121b').replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16) || 0;
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + (alpha == null ? 1 : alpha) + ')';
  }
  function recomputeStampRenderSrc() {
    return new Promise(function (resolve) {
      var baseImg = companyStamp && companyStamp.img;
      if (!baseImg) { stampRenderSrc = null; resolve(); return; }
      if (!companyStamp.color) { stampRenderSrc = baseImg; resolve(); return; }
      var img = new Image();
      img.onload = function () {
        try {
          var cvs = document.createElement('canvas');
          cvs.width = img.naturalWidth || 1; cvs.height = img.naturalHeight || 1;
          var ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0);
          ctx.globalCompositeOperation = 'source-in';
          ctx.fillStyle = hexToRgba(companyStamp.color, companyStamp.alpha == null ? 1 : companyStamp.alpha);
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          stampRenderSrc = cvs.toDataURL('image/png');
        } catch (e) { stampRenderSrc = baseImg; }
        resolve();
      };
      img.onerror = function () { stampRenderSrc = baseImg; resolve(); };
      img.src = baseImg;
    });
  }
  var companyBanks = []; // [{bankName,branchName,accountType,accountNumber,accountHolder}, ...] 会社全体・共通(複数口座対応)
  var companyBankKana = ''; // 銀行振込用のカタカナ名義(会社全体・共通)。表記ゆれがあるため、事務員さんに確認しながら「🏦 振込先を設定」でいつでも編集できる。
  // 実際の請求書(寺嶋工業様宛)の【取引銀行】欄と同じ内容。振込先が未登録(初回)の場合はこの内容を自動で登録しておく。
  var DEF_BANKS = [
    { bankName: '北洋銀行', branchName: '苫小牧中央支店', accountType: '普通', accountNumber: '4985116', accountHolder: '' },
    { bankName: '北海道銀行', branchName: '苫小牧支店', accountType: '普通', accountNumber: '1291652', accountHolder: '' },
    { bankName: '室蘭信用金庫', branchName: '苫小牧中央支店', accountType: '普通', accountNumber: '5360721', accountHolder: '' },
    { bankName: '苫小牧信用金庫', branchName: '川沿支店', accountType: '普通', accountNumber: '1037661', accountHolder: '' }
  ];

  var curProject = null;   // 選択中の⑪物件
  var draft = null;        // 編集中の請求書内容
  var currentInvoiceId = null;

  // ===== まとめ請求書(複数工事)モード =====
  var bundleMode = false;
  var bundle = null;
  var bundleDocs = [];
  function newBundle() {
    var issue = todayISO();
    return {
      id: null, no: '請求' + issue.replace(/-/g, ''),
      clientName: '', honorific: '御中', issueDate: issue, dueDate: addDaysISO(issue, 30), remarks: '',
      showBankKana: true,
      items: [],
      createdAt: null, updatedAt: null
    };
  }
  function newBundleItem() {
    return { projectId: '', title: '', pre: 0, subtotal: 0, tax: 0, total: 0, discount: 0, includeDetail: false, detailCats: [] };
  }

  function findCaseName(caseId) {
    if (!caseId) return '';
    var c = caseProjects.find(function (p) { return p.id === caseId; });
    return c ? (c.name || '') : '';
  }

  function buildDraftFromProject(proj) {
    var cfg = proj.cfg || {};
    var totals = calcTotals(proj);
    var issue = todayISO();
    var suggestedNo = (cfg.no && cfg.no.indexOf('見積') === 0) ? cfg.no.replace('見積', '請求') : ('請求' + issue.replace(/-/g, ''));
    return {
      id: null,
      projectId: proj.id,
      caseId: proj.caseId || '',
      quoteNo: cfg.no || '', quoteDate: cfg.date || '',
      invoiceNo: suggestedNo,
      issueDate: issue,
      dueDate: addDaysISO(issue, 30),
      clientName: cfg.client || '', honorific: cfg.honorific || '御中',
      title: cfg.proj || '',
      pre: totals.pre, subtotal: totals.ad, tax: totals.tax, total: totals.total, discount: totals.disc,
      company: { co1: cfg.co1 || '', co2: cfg.co2 || '', rep: cfg.rep || '', zip: cfg.zip || '', addr1: cfg.addr1 || '', addr2: cfg.addr2 || '', tel: cfg.tel || '', fax: cfg.fax || '', inv: cfg.inv || '' },
      remarks: '',

  // ===== 明細(工事内訳)を見積ツールの物件データから取り込む =====
  // お客様に見せてよい項目(工事名称・形状寸法等・数量・単位・お客様向け単価・金額)だけを抜き出す。
  // 原価(price)や掛け率(rate)、利益(margin)などの社内情報はここでは一切含めない。
  function buildDetailSnapshot(proj) {
    return (proj.cats || []).map(function (cat) {
      var items = (cat.items || []).map(function (it) {
        var c = ci(it);
        var hasVal = (it.qty > 0 && it.price > 0) || (it.decOverride != null && it.decOverride !== '');
        return {
          name: it.name || '', kei: it.kei || '', qty: it.qty || '', unit: it.unit || '',
          unitPrice: (it.price && it.rate) ? Math.round(it.price * it.rate) : null,
          amount: hasVal ? c.dec : null
        };
      });
      return { name: cat.name || '', items: items, subtotal: cc(cat).dec };
    });
  }

  function applyStampSizeMm() {
    var elx = document.getElementById('s-stampSizeMm');
    var mm = parseFloat(elx && elx.value);
    if (!mm || mm <= 0) { alert('サイズ(mm)を入力してください'); return; }
    var px = Math.round(mm * PX_PER_MM);
    var cur = getStampBox();
    stampLayout = { top: cur.top, right: cur.right, w: px, h: px };
    writeObj(STAMP_LAYOUT_KEY, stampLayout).then(function () { renderDocPreview(); });
  }
  function resetStampPosition() {
    var cur = getStampBox();

  }
  var stampDrag = null;
  function bindStampDrag() {
    document.addEventListener('pointerdown', function (e) {
      if (!document.body.classList.contains('stamp-edit')) return;
      var elx = e.target.closest('[data-company-stamp]');
      if (!elx) return;
      e.preventDefault();
      var box = getStampBox();
      stampDrag = { el: elx, startX: e.clientX, startY: e.clientY, startTop: box.top, startRight: box.right, newTop: null, newRight: null };
      try { elx.setPointerCapture(e.pointerId); } catch (err) {}
    });
    document.addEventListener('pointermove', function (e) {
      if (!stampDrag) return;
      var dx = e.clientX - stampDrag.startX, dy = e.clientY - stampDrag.startY;
      var newTop = Math.round((stampDrag.startTop + dy) * 10) / 10;
      var newRight = Math.round((stampDrag.startRight - dx) * 10) / 10;
      stampDrag.el.style.top = newTop + 'px';
      stampDrag.el.style.right = newRight + 'px';
      stampDrag.newTop = newTop; stampDrag.newRight = newRight;
    });
    function endStampDrag() {
      if (!stampDrag) return;
      var nt = stampDrag.newTop, nr = stampDrag.newRight;
      stampDrag = null;
      if (nt == null) return;
      var cur = getStampBox();
      stampLayout = { top: nt, right: nr, w: cur.w, h: cur.h };
      writeObj(STAMP_LAYOUT_KEY, stampLayout);
    }
    document.addEventListener('pointerup', endStampDrag);
    document.addEventListener('pointercancel', endStampDrag);
  }

  // ===== 請求書1枚分のHTMLを組み立てる(通常モード・まとめモード共通) =====
  // レイアウトは、⑪見積・実行予算Proの御見積書(表紙)と全く同じ書式をそのまま流用している。
  // タイトル(御請求書)→(左)発行日・請求書番号・宛先／(右)自社情報＋印→ご請求金額＋工事件名→(右)取引銀行→内訳表(種別/規格寸法/数量/単位/単価/金額/備考)＋小計/消費税/合計
  function buildInvoiceDocHtml(d) {
    var co = d.company || {};
    var caseName = findCaseName(d.caseId);
    var noText = d.invoiceNo ? d.invoiceNo : '　　　';
    var discRow = d.discount ? ('<tr class="total-row"><td class="l" colspan="2">値引き</td><td colspan="4" class="num">-' + fmtYen(d.discount) + '</td><td></td></tr>') : '';

    // ===== 内訳表の行 =====
    // 「内訳(工事内訳)を表示する」がオフの場合は、工事一式1行のみ(御見積書と同じ、種別+数量1式+金額の書き方)。
    // オンの場合は、見積の明細(全工種・全項目)をそのまま行として並べる。
    var rows = '';
    var dataRowsUsed = 0;
    if (d.includeDetail && d.detailCats && d.detailCats.length) {
      d.detailCats.forEach(function (cat) {
        (cat.items || []).forEach(function (it) {
          if (!it.name && !it.qty && it.amount == null) return;
          rows += '<tr><td class="l">' + esc(it.name) + '</td><td class="l">' + esc(it.kei) + '</td>' +
            '<td class="num">' + (it.qty ? esc(it.qty) : '') + '</td><td class="c">' + esc(it.unit) + '</td>' +
            '<td class="num">' + (it.unitPrice != null ? fmtYen(it.unitPrice) : '') + '</td>' +
            '<td class="num">' + (it.amount != null ? fmtYen(it.amount) : '') + '</td><td class="l"></td></tr>';
          dataRowsUsed++;
        });
      });
      if (!dataRowsUsed) {
        rows = '<tr><td class="l">' + esc(d.title || '工事一式') + '</td><td class="l"></td><td class="num">1</td><td class="c">式</td><td class="num"></td><td class="num">' + fmtYen(d.pre != null ? d.pre : d.subtotal) + '</td><td class="l"></td></tr>';
        dataRowsUsed = 1;
      }
    } else {
      rows = '<tr><td class="l">' + esc(d.title || '工事一式') + '</td><td class="l"></td><td class="num">1</td><td class="c">式</td><td class="num"></td><td class="num">' + fmtYen(d.pre != null ? d.pre : d.subtotal) + '</td><td class="l"></td></tr>';
      dataRowsUsed = 1;
    }
    // 種別数が少ない場合、御見積書と同様に表全体が常に13行になるよう空行で埋める(印刷時の見た目を安定させるため)
    var totalRowsCount = 3 + (d.discount ? 1 : 0); // 小計・[値引き]・消費税・合計
    var padCount = Math.max(0, 13 - 1 - totalRowsCount - dataRowsUsed);
    for (var pi = 0; pi < padCount; pi++) {
      rows += '<tr><td class="l">&nbsp;</td><td class="l"></td><td class="num"></td><td class="c"></td><td class="num"></td><td class="num"></td><td class="l"></td></tr>';
    }

    return (
      (d.id ? '<div class="doc-issued-badge no-print-keep">発行済み</div>' : '') +
      '<div class="pq-title-wrap"><span class="pq-title">御請求書</span></div>' +
      '<div class="pq-top">' +
        '<div class="pq-left">' +
          '<div>' + esc(fmtJp(d.issueDate)) + '<br>請求書番号　第　' + esc(noText) + '　号</div>' +
          '<div class="pq-client">' + esc(d.clientName) + '　' + esc(d.honorific || '御中') + '</div>' +
        '</div>' +
        '<div class="pq-co">' +
          (co.co2 ? '<div class="pq-co-line" style="font-size:9pt;color:#666">' + esc(co.co2) + '</div>' : '') +
          '<div class="pq-co-line name">' + esc(co.co1) + '</div>' +
          '<div class="pq-co-line">' + esc(co.rep) + '</div>' +
          '<div class="pq-co-line">' + esc(co.zip) + ' ' + esc(co.addr1) + (co.addr2 ? ' ' + esc(co.addr2) : '') + '</div>' +
          '<div class="pq-co-line">TEL ' + esc(co.tel) + '　FAX ' + esc(co.fax) + '</div>' +
          (co.inv ? '<div class="pq-co-line">インボイス登録番号　' + esc(co.inv) + '</div>' : '') +
          stampHtml() +
        '</div>' +
      '</div>' +
      '<div class="pq-mid">' +
        '<div class="pq-amount-col">' +
          '<div class="pq-amount-box"><span class="lbl">ご請求金額　</span><span class="val">' + fmtYen(d.total) + '　－</span></div>' +
          '<div class="pq-kojimei-wrap"><span class="pq-kojimei">工事件名　' + esc(d.title) + '</span></div>' +
        '</div>' +
        '<div class="pq-meta-col">' +
          '<div class="pq-meta">' + bankListHtml(d) + '</div>' +
        '</div>' +
      '</div>' +
      '<table class="pq-table"><thead><tr><th style="width:15%;">種別</th><th style="width:10%;">規格・寸法</th><th style="width:7%;">数量</th><th style="width:7%;">単位</th><th style="width:9%;">単価</th><th style="width:13%;">金額</th><th style="width:20%;">備考</th></tr></thead><tbody>' +
        rows +
        '<tr class="total-row"><td class="l" colspan="2">小　計</td><td colspan="4" class="num">' + fmtYen(d.pre != null ? d.pre : d.subtotal) + '</td><td></td></tr>' +
        discRow +
        '<tr class="total-row"><td class="l" colspan="2">消費税　10%</td><td colspan="4" class="num">' + fmtYen(d.tax) + '</td><td></td></tr>' +
        '<tr class="total-row"><td class="l" colspan="2">合　計</td><td colspan="4" class="num">' + fmtYen(d.total) + '</td><td></td></tr>' +
      '</tbody></table>' +
      (d.remarks ? '<div class="doc-remarks"><b>備考：</b>' + escNl(d.remarks) + '</div>' : '') +
      '<div class="doc-ref">' +
        (d.quoteNo ? ('本請求は御見積書 No.' + esc(d.quoteNo) + (d.quoteDate ? '(' + esc(d.quoteDate) + ')' : '') + ' に基づきます。') : '') +
        (caseName ? '　／　案件管理: ' + esc(caseName) : '') +
      '</div>'
    );
  }

  // ===== 振込先(会社全体・共通・複数口座)設定モーダル =====
  function bankRowHtml(b, idx) {
    b = b || {};

  // ===== 発行として保存(スナップショット) =====
  function issueInvoice() {
    pullForm();
    if (!draft.invoiceNo || !draft.clientName) { alert('請求書番号と宛先(顧客名)は入力してください。'); return; }
    var now = Date.now();
    if (!draft.id) { draft.id = genId(); draft.createdAt = now; }
    draft.updatedAt = now;
    readArr(INVOICE_DOCS_KEY).then(function (arr) {
      var idx = arr.findIndex(function (d) { return d.id === draft.id; });
      var rec = JSON.parse(JSON.stringify(draft));
      if (idx >= 0) arr[idx] = rec; else arr.push(rec);
      return writeArr(INVOICE_DOCS_KEY, arr).then(function () {
        invoiceDocs = arr;
        currentInvoiceId = draft.id;
        renderMain();
        renderHistory();
        alert('請求書を発行として保存しました。\n以後、元の見積を変更してもこの内容は変わりません。');
      });
    });
  }

  function deleteIssuedInvoice(id) {
    var rec = invoiceDocs.find(function (d) { return d.id === id; });
    if (!rec) return;
    var msg = 'この操作は取り消せません。\n\n請求書番号「' + rec.invoiceNo + '」(宛先: ' + rec.clientName + '　' + fmtYen(rec.total) + ')の発行済み記録を完全に削除します。\n\n※誤って発行してしまった場合のみ使ってください。\n\n本当に削除しますか?';
    if (!confirm(msg)) return;
    readArr(INVOICE_DOCS_KEY).then(function (arr) {
      arr = arr.filter(function (d) { return d.id !== id; });
      return writeArr(INVOICE_DOCS_KEY, arr).then(function () {
        invoiceDocs = arr;
        if (draft && draft.id === id) {
          draft = buildDraftFromProject(curProject);
          currentInvoiceId = null;
        }
        renderMain();
        renderHistory();
        alert('削除しました。');
      });
    });
  }

  // ===== 発行済み請求書の一覧(この物件ぶん) =====
  function renderHistory() {
    var el = document.getElementById('historyArea');
    if (!curProject) { el.innerHTML = ''; return; }
    var mine = invoiceDocs.filter(function (d) { return d.projectId === curProject.id; }).sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });
    if (!mine.length) {
      el.innerHTML = '<div class="panel no-print"><h2>📜 発行済みの請求書</h2><p class="empty-note">この物件では、まだ請求書を発行していません。</p></div>';
      return;
    }
    var rows = mine.map(function (d) {
      return '<tr><td>' + esc(d.invoiceNo) + '</td><td>' + esc(fmtJp(d.issueDate)) + '</td><td>' + esc(d.clientName) + '</td><td style="text-align:right;font-family:\'Courier New\',monospace">' + fmtYen(d.total) + '</td><td style="white-space:nowrap"><button class="btn" data-open="' + esc(d.id) + '" style="padding:5px 10px;font-size:12px">開く</button> <button class="btn" data-del="' + esc(d.id) + '" style="padding:5px 10px;font-size:12px;color:var(--danger);border-color:#F3C6C9" title="誤って発行してしまった場合のみ">🗑</button></td></tr>';
    }).join('');
    el.innerHTML =
      '<div class="panel no-print"><h2>📜 発行済みの請求書</h2>' +
        '<table class="hist"><thead><tr><th>請求書番号</th><th>発行日</th><th>宛先</th><th>金額</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';
    el.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.addEventListener('click', function () { deleteIssuedInvoice(btn.getAttribute('data-del')); });
    });
    el.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-open');
        var rec = invoiceDocs.find(function (d) { return d.id === id; });
        if (!rec) return;
        draft = JSON.parse(JSON.stringify(rec));
        currentInvoiceId = id;
        renderMain();
        renderHistory();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  }

  // ===== まとめ請求書(複数工事)モード =====

    document.getElementById('historyArea').style.display = on ? 'none' : '';

        '<div class="pq-meta-col"><div class="pq-meta">' + bankListHtml(bundle) + '</div></div>' +
      '</div>' +
      '<div class="hint" style="margin:2px 0 4px;font-size:9pt;color:var(--text-secondary)">下記工事につき、合計にてご請求申し上げます。(内訳は次ページ以降の各請求書をご覧ください)</div>' +
      '<table class="hist"><thead><tr><th>No</th><th>請求書番号</th><th>工事名</th><th style="text-align:right">金額(税込)</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      (bundle.remarks ? '<div class="doc-remarks"><b>備考：</b>' + escNl(bundle.remarks) + '</div>' : '');

    var pagesHtml = bundle.items.map(function (it, idx) {
      var d = {
        id: bundle.id, invoiceNo: bundleItemInvoiceNo(bundle, idx), issueDate: bundle.issueDate, dueDate: bundle.dueDate,
        clientName: bundle.clientName, honorific: bundle.honorific, title: it.title,
        pre: it.pre, total: it.total, tax: it.tax, subtotal: it.subtotal, discount: it.discount || 0, company: bundleCompanyInfo(it),
        remarks: bundle.remarks, includeDetail: it.includeDetail, detailCats: it.detailCats, showBankKana: bundle.showBankKana,
        quoteNo: '', quoteDate: '', caseId: ''
      };
      return '<div class="doc doc-cover bundle-page">' + buildInvoiceDocHtml(d) + '</div>';
    }).join('');

    wrap.innerHTML = '<div class="doc doc-cover">' + coverHtml + '</div>' + pagesHtml;
  }

  function issueBundle() {
    if (!bundle.items.length) { alert('工事を1件以上追加してください。'); return; }
    if (!bundle.clientName) { alert('宛先(顧客名)を入力してください。'); return; }
    var now = Date.now();
    if (!bundle.id) { bundle.id = genId(); bundle.createdAt = now; }
    bundle.updatedAt = now;
    readArr(INVOICE_BUNDLES_KEY).then(function (arr) {
      var idx = arr.findIndex(function (b) { return b.id === bundle.id; });
      var rec = JSON.parse(JSON.stringify(bundle));
      if (idx >= 0) arr[idx] = rec; else arr.push(rec);
      return writeArr(INVOICE_BUNDLES_KEY, arr).then(function () {
        bundleDocs = arr;
        renderBundle();
        alert('まとめ請求書を発行として保存しました。\n以後、元の見積を変更してもこの内容は変わりません。');
      });
    });
  }

  function deleteBundle(id) {
    var rec = bundleDocs.find(function (b) { return b.id === id; });
    if (!rec) return;
    var msg = 'この操作は取り消せません。\n\n「' + rec.no + '」(宛先: ' + rec.clientName + ')のまとめ請求書を完全に削除します。\n\n※誤って発行してしまった場合のみ使ってください。\n\n本当に削除しますか?';
    if (!confirm(msg)) return;
    readArr(INVOICE_BUNDLES_KEY).then(function (arr) {
      arr = arr.filter(function (b) { return b.id !== id; });
      return writeArr(INVOICE_BUNDLES_KEY, arr).then(function () {
        bundleDocs = arr;
        if (bundle && bundle.id === id) { bundle = newBundle(); }
        renderBundle();
        alert('削除しました。');
      });
    });
  }

  function renderBundleHistory() {
    var el = document.getElementById('bundleHistoryArea');
    if (!el) return;
    if (!bundleDocs.length) { el.innerHTML = '<div class="panel no-print"><h2>📜 発行済みのまとめ請求書</h2><p class="empty-note">まだありません。</p></div>'; return; }
    var rows = bundleDocs.slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).map(function (b) {
      var grand = (b.items || []).reduce(function (s, it) { return s + (Number(it.total) || 0); }, 0);
      return '<tr><td>' + esc(b.no) + '</td><td>' + esc(fmtJp(b.issueDate)) + '</td><td>' + esc(b.clientName) + '</td><td>' + (b.items ? b.items.length : 0) + '件</td><td style="text-align:right;font-family:\'Courier New\',monospace">' + fmtYen(grand) + '</td><td style="white-space:nowrap"><button class="btn" data-bopen="' + esc(b.id) + '" style="padding:5px 10px;font-size:12px">開く</button> <button class="btn" data-bdel="' + esc(b.id) + '" style="padding:5px 10px;font-size:12px;color:var(--danger);border-color:#F3C6C9" title="誤って発行してしまった場合のみ">🗑</button></td></tr>';
    }).join('');
    el.innerHTML = '<div class="panel no-print"><h2>📜 発行済みのまとめ請求書</h2><table class="hist"><thead><tr><th>番号</th><th>発行日</th><th>宛先</th><th>件数</th><th>合計</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    el.querySelectorAll('[data-bopen]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-bopen');
        var rec = bundleDocs.find(function (b) { return b.id === id; });
        if (!rec) return;
        bundle = JSON.parse(JSON.stringify(rec));
        renderBundle();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    el.querySelectorAll('[data-bdel]').forEach(function (btn) {
      btn.addEventListener('click', function () { deleteBundle(btn.getAttribute('data-bdel')); });
    });
  }

  document.getElementById('btnToggleBundleMode').addEventListener('click', function () {
    setBundleMode(!bundleMode);
  });

  function renderAll() {
    renderPicker();
    renderMain();
    renderHistory();
  }

  // ===== 起動 =====
  function init() {
    var params = new URLSearchParams(window.location.search);
    var pid = params.get('project') || '';

    Promise.all([
      readObj(PROJ_LIST_KEY),
      readRaw(PROJ_CUR_KEY),
      readArr(CASE_PROJECTS_KEY),
      readArr(INVOICE_DOCS_KEY),
      readObj(COMPANY_STAMP_KEY),
      storageGet(COMPANY_BANKS_KEY),
      readObj(STAMP_LAYOUT_KEY),
      readArr(INVOICE_BUNDLES_KEY),
      readRaw(COMPANY_BANK_KANA_KEY)
    ]).then(function (res) {
      projects = Array.isArray(res[0]) ? res[0] : [];
      var curId = res[1] || '';
      caseProjects = res[2] || [];
      invoiceDocs = res[3] || [];
      companyStamp = res[4] || { img: null };
      stampLayout = res[6] || null;
      bundleDocs = res[7] || [];
      companyBankKana = res[8] || '';

      // 振込先が一度も保存されていない(初回起動)場合は、実際の請求書(寺嶋工業様宛)と同じ4口座を自動で登録しておく。
      // 一度でも保存されていれば(空にした場合も含め)、その内容をそのまま尊重する。
      var bankRaw = res[5];
      if (bankRaw === null) {
        companyBanks = DEF_BANKS;
        writeArr(COMPANY_BANKS_KEY, companyBanks);
      } else {
        try { var parsedBanks = bankRaw.value ? JSON.parse(bankRaw.value) : []; companyBanks = Array.isArray(parsedBanks) ? parsedBanks : []; }
        catch (e) { companyBanks = []; }
      }

      var target = null;
      if (pid) target = projects.find(function (p) { return p.id === pid; });
      if (!target && !pid && curId) target = projects.find(function (p) { return p.id === curId; });

      if (target) {
        curProject = target;
        draft = buildDraftFromProject(target);
      }
      bindStampDrag();
      recomputeStampRenderSrc().then(renderAll);
    }).catch(function () {
      bindStampDrag();
      renderAll();
    });
  }

  init();
})();
</script>
</body>
</html>
