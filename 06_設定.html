<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="app-build" content="2026-08-18-5" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>設定 | 太豊建設アプリ</title>
<style>
  :root {
    --bg: #F6F5FB; --surface: #FFFFFF; --primary: #6C47FF; --primary-dark: #5636D9;
    --primary-soft: #EFEAFF; --text: #1E1B2E; --text-secondary: #6B6580; --text-tertiary: #9C97AE;
    --border: #E7E4F0; --danger: #F0525C; --success: #10B981; --radius: 12px;
    --shadow-sm: 0 1px 2px rgba(30,27,46,0.06); --shadow-md: 0 8px 24px rgba(30,27,46,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans','Yu Gothic','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
  .shell { max-width: 1240px; margin: 0 auto; padding: 20px 20px 60px; }

  .page-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .page-header__title { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 22px; }
  .page-header__title .badge-count { font-family: 'Courier New', monospace; font-size: 12px; font-weight: 600; color: var(--primary); background: var(--primary-soft); padding: 3px 9px; border-radius: 100px; }
  .page-header__actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .search-box { position: relative; flex: 1; min-width: 180px; max-width: 280px; }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); pointer-events: none; }
  .search-box input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-family: inherit; color: var(--text); outline: none; }
  .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  .btn { display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-weight: 700; font-size: 13.5px; padding: 10px 16px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn--primary { background: var(--primary); color: white; box-shadow: var(--shadow-sm); }
  .btn--primary:hover { background: var(--primary-dark); }
  .btn--ghost { background: transparent; color: var(--text-secondary); border-color: var(--border); }
  .btn--ghost:hover { background: #F1EFFB; }
  .btn--danger-ghost { background: transparent; color: var(--danger); border-color: #FBD5D8; }
  .btn--danger-ghost:hover { background: #FEF1F2; }
  .btn--sm { padding: 7px 12px; font-size: 12.5px; }

  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; }
  .icon-btn:hover { background: #F1EFFB; color: var(--text); }

  .module-tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 5px; flex-wrap: wrap; }
  .module-tab { display:flex; align-items:center; gap:6px; font-family: inherit; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 8px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; }
  .module-tab.is-active { background: var(--primary); color: white; }
  .module-tab.is-disabled { color: var(--text-tertiary); cursor: default; }
  .module-tab .soon { font-size: 9px; font-weight: 700; background: var(--bg); border: 1px solid var(--border); color: var(--text-tertiary); padding: 1px 6px; border-radius: 999px; }
  #trashCountBadge { font-size:11px; font-weight:700; background:#F0525C; color:#fff; border-radius:100px; padding:1px 7px; margin-left:2px; }
  .status-chip { font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 13px; border-radius: 999px; cursor: pointer; border: 1.5px solid var(--chip-color); color: var(--chip-color); background: color-mix(in srgb, var(--chip-color) 10%, white); transition: all .15s; display:inline-flex; align-items:center; }
  .status-chip.is-active { background: var(--chip-color); color: white; }
  .status-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .trash-row { display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--surface); }
  .trash-row__info { flex:1; min-width:0; }
  .trash-row__name { font-weight:700; font-size:14.5px; }
  .trash-row__meta { font-size:12px; color:var(--text-tertiary); margin-top:2px; }
  .trash-row__actions { display:flex; gap:8px; flex-shrink:0; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; overflow-x: auto; }
  table.data-table { width: 100%; border-collapse: collapse; }
  .data-table thead th { text-align: left; font-size: 12px; font-weight: 700; color: var(--text-tertiary); padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .data-table tbody tr { border-bottom: 1px solid var(--border); }
  .data-table tbody tr:last-child { border-bottom: none; }
  .data-table tbody tr:hover { background: #FBFAFF; }
  .data-table td { padding: 13px 16px; font-size: 13.5px; vertical-align: middle; white-space: nowrap; }
  .cell-name { font-weight: 700; background:none; border:none; cursor:pointer; text-align:left; color:inherit; font-family:inherit; font-size:inherit; padding:0; }
  .cell-actions { text-align: right; }
  .amount-text { font-family: 'Courier New', monospace; font-weight: 700; }
  .tax-note { font-size: 10.5px; color: var(--text-tertiary); display:block; }

  .biz-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 640px; }
  .biz-card h3 { font-size: 13px; color: var(--text-tertiary); margin: 20px 0 10px; text-transform: uppercase; letter-spacing: .04em; }
  .biz-card h3:first-child { margin-top: 0; }
  .biz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .biz-grid .field--full { grid-column: 1 / -1; }
  @media (max-width: 560px) { .biz-grid { grid-template-columns: 1fr; } }

  .role-badge { display:inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; color: white; }

  .card-list { display: none; flex-direction: column; gap: 10px; }
  .data-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; border-left: 4px solid var(--primary); }
  .data-card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .data-card__name { font-weight: 700; font-size: 15px; }
  .data-card__meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); }

  @media (max-width: 860px) {
    .table-wrap { display: none; }
    .card-list { display: flex; }
    .shell { padding: 14px 12px 80px; }
    .page-header__title { font-size: 19px; }
    .search-box { max-width: none; order: 3; flex-basis: 100%; }
  }

  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 20px; color: var(--text-tertiary); gap: 8px; }
  .empty-state__title { font-weight: 700; color: var(--text); font-size: 15px; margin-top: 6px; }
  .empty-state__desc { font-size: 13px; margin-bottom: 10px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(20,17,36,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-md); }
  .modal__header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .modal__header h2 { font-size: 17px; font-weight: 700; margin: 0; }
  .modal__body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal__footer { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border); }
  .modal__footer-right { display: flex; gap: 8px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); }
  .field .req { color: var(--danger); }
  .field input, .field select, .field textarea { font-family: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; outline: none; color: var(--text); background: var(--surface); width: 100%; }
  .field input:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .field input.is-error, .field select.is-error { border-color: var(--danger); }
  .field__error { color: var(--danger); font-size: 11.5px; margin: 0; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; min-width: 0; }
  .unit-row { display: flex; gap: 6px; }
  .unit-row select { flex: 1; }
  @media (max-width: 480px) { .field-row { flex-direction: column; } }

  .confirm-box { background: var(--surface); border-radius: 14px; padding: 20px; max-width: 360px; width: 100%; box-shadow: var(--shadow-md); }
  .confirm-box__icon { color: var(--danger); margin-bottom: 8px; }
  .confirm-box h3 { margin: 0 0 6px; font-size: 15px; }
  .confirm-box p { margin: 0 0 16px; font-size: 13px; color: var(--text-secondary); }
  .confirm-box__actions { display: flex; justify-content: flex-end; gap: 8px; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); z-index: 200; display: flex; align-items: center; gap: 8px; }

  .loading-wrap { display:flex; align-items:center; justify-content:center; padding: 80px 0; color: var(--text-tertiary); font-size: 13px; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .7s linear infinite; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hamburger-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; flex-shrink: 0; }
  .hamburger-btn:hover { background: #F1EFFB; }
  .shell-wrap { transition: margin-left .2s ease; }
  @media (min-width: 961px) { .shell-wrap.sidebar-open { margin-left: 232px; } }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 232px; background: var(--surface);
    border-right: 1px solid var(--border); padding: 18px 12px; display: flex; flex-direction: column;
    gap: 2px; overflow-y: auto; z-index: 150; transform: translateX(-100%); transition: transform .2s ease;
  }
  .sidebar.is-open { transform: translateX(0); box-shadow: var(--shadow-md); }
  .sidebar__brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; color: var(--primary); padding: 6px 10px 16px; text-decoration:none; }
  .sidebar__section { font-size: 11px; font-weight: 700; color: var(--text-tertiary); padding: 14px 12px 4px; }
  .sidebar__link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 700; color: var(--text-secondary); text-decoration: none; }
  .sidebar__link:hover { background: #F1EFFB; color: var(--text); }
  .sidebar__link.is-active { background: var(--primary-soft); color: var(--primary); }
  .sidebar__link.is-disabled { color: var(--text-tertiary); cursor: default; pointer-events: none; }
  .sidebar__link .soon { margin-left: auto; font-size: 9.5px; font-weight: 700; background: var(--bg); border: 1px solid var(--border); color: var(--text-tertiary); padding: 2px 6px; border-radius: 999px; white-space: nowrap; }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(20,17,36,0.45); z-index: 140; display: none; }
  .sidebar-overlay.is-open { display: block; }
</style>

<script>
(function () {
  "use strict";
  var BACKUP_COLLECTION = "taiho_app_data";
  var LAST_BACKUP_KEY = "taiho_last_auto_backup_date_v1";
  var AUTO_BACKUP_TIME_KEY = "taiho_auto_backup_time_v1"; // "HH:MM" 形式。この時刻以降、その日まだ自動バックアップしていなければ自動保存する
  var DEFAULT_AUTO_BACKUP_TIME = "17:00";

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function todayStr(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function getAutoBackupTime() {
    var raw = null;
    try { raw = window.localStorage.getItem(AUTO_BACKUP_TIME_KEY); } catch (e) {}
    if (raw && /^([01]?\d|2[0-3]):[0-5]\d$/.test(raw)) return raw;
    return DEFAULT_AUTO_BACKUP_TIME;
  }
  function getAutoBackupMinutes() {
    var t = getAutoBackupTime().split(":");
    return parseInt(t[0], 10) * 60 + parseInt(t[1], 10);
  }
  window.__taihoGetAutoBackupTime = getAutoBackupTime;
  window.__taihoSetAutoBackupTime = function (v) {
    if (!/^([01]?\d|2[0-3]):[0-5]\d$/.test(v)) return false;
    try { window.localStorage.setItem(AUTO_BACKUP_TIME_KEY, v); } catch (e) {}
    return true;
  };

  function collectFromLocalStorage() {
    var out = {};
    try {
      for (var i = 0; i < window.localStorage.length; i++) {
        var k = window.localStorage.key(i);
        if (k && k.indexOf("taiho_") === 0) out[k] = window.localStorage.getItem(k);
      }
    } catch (e) {}
    return out;
  }

  function collectAllData() {
    return new Promise(function (resolve) {
      if (window.db) {
        window.db.collection(BACKUP_COLLECTION).get().then(function (snap) {
          var out = {};
          snap.forEach(function (doc) {
            var d = doc.data();
            out[doc.id] = (d && Object.prototype.hasOwnProperty.call(d, "value")) ? d.value : d;
          });
          resolve(out);
        }).catch(function () { resolve(collectFromLocalStorage()); });
      } else {
        resolve(collectFromLocalStorage());
      }
    });
  }

  function downloadBackup(data) {
    try {
      var payload = { app: "太豊建設アプリ", exportedAt: new Date().toISOString(), data: data };
      var json = JSON.stringify(payload, null, 2);
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "太豊建設アプリ_バックアップ_" + todayStr() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return true;
    } catch (e) { return false; }
  }

  var BANNER_ID = "taihoAutoBackupBanner";
  var BANNER_DISMISS_KEY = "taiho_auto_backup_banner_dismissed_v1";
  var LAST_BACKUP_AT_KEY = "taiho_last_backup_at_v1"; // 表示用(日時の文字列)

  function runBackup() {
    return collectAllData().then(function (data) {
      var ok = downloadBackup(data);
      try {
        window.localStorage.setItem(LAST_BACKUP_KEY, todayStr());
        if (ok) window.localStorage.setItem(LAST_BACKUP_AT_KEY, new Date().toLocaleString("ja-JP"));
      } catch (e) {}
      return ok;
    });
  }
  window.__taihoGetLastBackupAt = function () {
    try { return window.localStorage.getItem(LAST_BACKUP_AT_KEY); } catch (e) { return null; }
  };
  window.__taihoResetTodayBackupFlag = function () {
    try {
      window.localStorage.removeItem(LAST_BACKUP_KEY);
      window.sessionStorage.removeItem(BANNER_DISMISS_KEY);
    } catch (e) {}
  };
  window.__taihoRunBackup = function (manual) {
    runBackup().then(function (ok) {
      if (manual) {
        if (ok) alert("バックアップを保存しました。ダウンロードフォルダをご確認ください。");
        else alert("バックアップの保存に失敗しました。お手数ですが、もう一度お試しください。");
      }
    });
  };

  // ブラウザは、画面操作(クリックなど)を伴わずに勝手にファイルを保存することを
  // セキュリティ上ブロックすることがあるため、時間になったら右下に通知を出し、
  // ワンクリックで確実に保存できるようにする。
  function showAutoBackupBanner() {
    try {
      if (document.getElementById(BANNER_ID)) return;
      if (window.sessionStorage.getItem(BANNER_DISMISS_KEY) === todayStr()) return;
    } catch (e) {}
    if (!document.body) return;
    var el = document.createElement("div");
    el.id = BANNER_ID;
    el.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:99999;background:#1F2937;color:#fff;" +
      "padding:14px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:13px;max-width:280px;" +
      "line-height:1.6;font-family:inherit;";
    el.innerHTML =
      '<div style="font-weight:800;margin-bottom:6px;">⏰ 本日のバックアップの時間です</div>' +
      '<div style="color:#D1D5DB;margin-bottom:10px;">クリックしてPCに保存してください。</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button type="button" id="taihoBackupBannerSave" style="flex:1;background:#7C6FF0;color:#fff;border:none;' +
      'border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;font-size:12.5px;">📥 今すぐ保存</button>' +
      '<button type="button" id="taihoBackupBannerClose" style="background:transparent;color:#9CA3AF;border:none;' +
      'cursor:pointer;font-size:16px;padding:0 6px;">×</button>' +
      '</div>';
    document.body.appendChild(el);
    var saveBtn = document.getElementById("taihoBackupBannerSave");
    var closeBtn = document.getElementById("taihoBackupBannerClose");
    if (saveBtn) saveBtn.addEventListener("click", function () {
      saveBtn.disabled = true;
      saveBtn.textContent = "保存中...";
      runBackup().then(function (ok) {
        el.innerHTML = ok
          ? '<div style="font-weight:800;">✅ バックアップを保存しました</div>'
          : '<div style="font-weight:800;">⚠️ 保存に失敗しました</div>';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
      });
    });
    if (closeBtn) closeBtn.addEventListener("click", function () {
      try { window.sessionStorage.setItem(BANNER_DISMISS_KEY, todayStr()); } catch (e) {}
      if (el.parentNode) el.parentNode.removeChild(el);
    });
  }

  function checkAutoBackup() {
    try {
      var now = new Date();
      var last = window.localStorage.getItem(LAST_BACKUP_KEY);
      if (last === todayStr(now)) return; // 今日はすでにバックアップ済み
      var nowMin = now.getHours() * 60 + now.getMinutes();
      if (nowMin < getAutoBackupMinutes()) return; // まだ設定した時刻になっていない
      showAutoBackupBanner();
    } catch (e) {}
  }

  function testAutoBackupNow() {
    try {
      var now = new Date();
      var nowMin = now.getHours() * 60 + now.getMinutes();
      var thr = getAutoBackupMinutes();
      if (nowMin < thr) {
        alert(
          "現在時刻(" + pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ")は、" +
          "設定した自動バックアップ時刻(" + getAutoBackupTime() + ")よりも前のため、まだ実行されません。\n" +
          "動作を今すぐ確認したい場合は、設定時刻を現在より前の時刻(例:今より1分前)に変更してから、もう一度お試しください。"
        );
        return;
      }
      try { window.sessionStorage.removeItem(BANNER_DISMISS_KEY); } catch (e) {}
      showAutoBackupBanner();
    } catch (e) {}
  }
  window.__taihoTestAutoBackup = testAutoBackupNow;

  document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("btnSidebarBackup");
    if (btn) btn.addEventListener("click", function (e) { e.preventDefault(); window.__taihoRunBackup(true); });
    setTimeout(checkAutoBackup, 1500);
  });
})();
</script>

  // 保存の直前にクラウドから最新データを取得し直し、そこに変更を適用してから保存する(他の人の更新を上書きしないための安全策)
  function transformArrayInStorage(key, getCurrent, setCurrent, transformFn) {
    return storageGet(key).then(function (res) {
      var fresh = null;
      try { fresh = res && res.value ? JSON.parse(res.value) : null; } catch (e) { fresh = null; }
      if (!Array.isArray(fresh)) fresh = getCurrent();
      var next = transformFn(fresh);
      setCurrent(next);
      return storageSet(key, JSON.stringify(next)).then(function () { return next; });
    }).catch(function () {
      var next = transformFn(getCurrent());
      setCurrent(next);
      return storageSet(key, JSON.stringify(next)).then(function () { return next; });
    }).catch(function () { showToast("保存に失敗しました"); });
  }
  function makePersistTransform(key, stateField) {
    return function (transformFn) {
      return transformArrayInStorage(key, function () { return state[stateField]; }, function (v) { state[stateField] = v; }, transformFn);
    };
  }

  var persistUnitsTransform = makePersistTransform(UNITS_KEY, "units");
  var persistMembersTransform = makePersistTransform(MEMBERS_KEY, "members");
  function persistTypeListTransform(catId, transformFn) {
    var key = typeCategoryOf(catId).key;
    return transformArrayInStorage(

      function () { return state.typeSettings[catId]; },
      function (v) { state.typeSettings[catId] = v; },
      transformFn

  }

      '</div>';
    document.getElementById("backupBtn").addEventListener("click", backupAll);

  function backupAll() {
    var btn = document.getElementById("backupBtn");
    var status = document.getElementById("backupStatus");
    if (btn) { btn.disabled = true; btn.textContent = "書き出し中..."; }
    if (status) status.textContent = "";
    Promise.all(BACKUP_KEYS.map(function (k) { return storageGet(k.key); })).then(function (results) {
      var data = {};
      BACKUP_KEYS.forEach(function (k, i) {
        data[k.key] = (results[i] && results[i].value) ? results[i].value : null;
      });
      var obj = { app: "taiho-kensetsu-app", version: 1, exportDate: new Date().toLocaleString("ja-JP"), data: data };
      var json = JSON.stringify(obj, null, 2);
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      var d = new Date();
      var ds = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0") + "_" + String(d.getHours()).padStart(2,"0") + String(d.getMinutes()).padStart(2,"0");
      a.download = "taiho_backup_" + ds + ".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("バックアップを書き出しました");
      if (status) status.textContent = "最終書き出し: " + obj.exportDate;
    }).catch(function () {
      showToast("書き出しに失敗しました");
    }).then(function () {
      if (btn) { btn.disabled = false; btn.textContent = "📤 全データをバックアップ(PCに保存)"; }
    });
  }

  function bindAutoBackupTimeUI() {
    var input = document.getElementById("autoBackupTimeInput");
    var status = document.getElementById("autoBackupTimeStatus");
    var saveBtn = document.getElementById("btnSaveAutoBackupTime");
    var testBtn = document.getElementById("btnTestAutoBackup");
    var lastAtEl = document.getElementById("lastBackupAtStatus");
    var resetLink = document.getElementById("btnResetAutoBackupFlag");
    if (!input) return;
    input.value = (window.__taihoGetAutoBackupTime ? window.__taihoGetAutoBackupTime() : "17:00");
    if (status) status.textContent = "現在の設定: 毎日 " + input.value + " 以降にアプリを開くと自動保存されます。";
    refreshLastBackupAtStatus();
    if (saveBtn) saveBtn.addEventListener("click", function () {
      var v = input.value;
      if (!v || !window.__taihoSetAutoBackupTime || !window.__taihoSetAutoBackupTime(v)) {
        if (status) status.textContent = "時刻を選択してください。";
        return;
      }
      if (status) status.textContent = "保存しました。毎日 " + v + " 以降にアプリを開くと自動保存されます。";
      showToast("自動バックアップの時刻を保存しました");
    });
    if (testBtn) testBtn.addEventListener("click", function () {
      if (window.__taihoTestAutoBackup) window.__taihoTestAutoBackup();
      setTimeout(refreshLastBackupAtStatus, 800);
    });
    if (resetLink) resetLink.addEventListener("click", function (e) {
      e.preventDefault();
      if (window.__taihoResetTodayBackupFlag) window.__taihoResetTodayBackupFlag();
      showToast("本日の保存済み状態をリセットしました。もう一度お試しください。");
      refreshLastBackupAtStatus();
    });
    function refreshLastBackupAtStatus() {
      if (!lastAtEl) return;
      var at = window.__taihoGetLastBackupAt ? window.__taihoGetLastBackupAt() : null;
      lastAtEl.textContent = at ? ("前回のバックアップ保存: " + at) : "前回のバックアップ保存: まだありません";
    }
  }

  function restoreFromFile(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var obj = JSON.parse(e.target.result);
        if (!obj || !obj.data || typeof obj.data !== "object") {
          alert("このファイルは対応していない形式です。「全データをバックアップ」で作成したファイルを選んでください。");
          input.value = ""; return;
        }
        if (!confirm("バックアップファイル「" + file.name + "」から復元します。\n現在クラウドに保存されているデータは全て上書きされます。\nこの操作は元に戻せません。よろしいですか？")) {
          input.value = ""; return;
        }
        var keys = Object.keys(obj.data);
        Promise.all(keys.map(function (k) {
          var v = obj.data[k];
          if (v === null || v === undefined) return Promise.resolve();
          return storageSet(k, v);
        })).then(function () {
          showToast("復元しました。ページを再読み込みします...");
          setTimeout(function () { location.reload(); }, 1200);
        }).catch(function () {
          alert("復元中にエラーが発生しました。");
        });
      } catch (ex) {
        alert("読み込みに失敗しました。正しいバックアップファイルか確認してください。\n" + ex.message);
      }
      input.value = "";
    };
    reader.readAsText(file, "UTF-8");
  }

      var coefSel = document.getElementById("f_coef").value;

        var cv = Number(document.getElementById("f_coefCustom").value);

      } else if (coefSel) {
        coefValue = Number(coefSel);

  function updateTrashBadge() {
    var n = state.items.filter(function (x) { return x.deletedAt; }).length +
            state.members.filter(function (x) { return x.deletedAt; }).length +
            TYPE_SETTINGS_CATEGORIES.reduce(function (sum, c) {
              return sum + (state.typeSettings[c.id] || []).filter(function (x) { return x.deletedAt; }).length;
            }, 0);
    var badge = document.getElementById("trashCountBadge");
    if (n > 0) { badge.style.display = "inline-block"; badge.textContent = n; }
    else { badge.style.display = "none"; }
  }

  function fmtDeletedAt(ts) {
    if (!ts) return "-";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return "-";
    return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  function renderTrashResults(area) {
    var items = []
      .concat(state.items.filter(function (x) { return x.deletedAt; }).map(function (x) { return { kind: "item", label: "単価項目", name: x.name || "(名称未設定)", id: x.id, deletedAt: x.deletedAt }; }))
      .concat(state.members.filter(function (x) { return x.deletedAt; }).map(function (x) { return { kind: "member", label: "メンバー", name: x.name || "(名称未設定)", id: x.id, deletedAt: x.deletedAt }; }));
    TYPE_SETTINGS_CATEGORIES.forEach(function (c) {
      (state.typeSettings[c.id] || []).filter(function (x) { return x.deletedAt; }).forEach(function (x) {
        items.push({ kind: "typeItem", catId: c.id, label: c.label, name: x.label || "(名称未設定)", id: x.id, deletedAt: x.deletedAt });
      });
    });
    items.sort(function (a, b) { return (b.deletedAt||0) - (a.deletedAt||0); });
    document.getElementById("countBadge").textContent = items.length + "件";

    if (items.length === 0) {
      area.innerHTML =
        '<div class="empty-state">' + ICON_TRASH +
        '<p class="empty-state__title">ゴミ箱は空です</p><p class="empty-state__desc">削除した単価項目・メンバー・タイプ設定項目はここに一時的に保管され、後から元に戻せます。</p></div>';
      return;
    }
    area.innerHTML =
      '<p style="font-size:12.5px;color:var(--text-tertiary);margin:0 0 14px;">削除したデータはここに保管されます。「元に戻す」でいつでも復元できます。「完全に削除」を押すと復元できなくなります。</p>' +
      items.map(function (it, idx) {
        return '<div class="trash-row">' +
          '<div class="trash-row__info">' +
            '<div class="trash-row__name">' + esc(it.name) + '</div>' +
            '<div class="trash-row__meta">' + esc(it.label) + '・削除日時: ' + fmtDeletedAt(it.deletedAt) + '</div>' +
          '</div>' +
          '<div class="trash-row__actions">' +
            '<button class="btn btn--ghost btn--sm" data-restore-idx="' + idx + '">元に戻す</button>' +
            '<button class="btn btn--danger-ghost btn--sm" data-purge-idx="' + idx + '">完全に削除</button>' +
          '</div>' +
        '</div>';
      }).join("");

    function restoreItem(it) {
      if (it.kind === "item") {
        persistItemsTransform(function (fresh) { return fresh.map(function (x) { return x.id === it.id ? Object.assign({}, x, { deletedAt: null }) : x; }); }).then(function () { renderResults(); });
      } else if (it.kind === "member") {
        persistMembersTransform(function (fresh) { return fresh.map(function (x) { return x.id === it.id ? Object.assign({}, x, { deletedAt: null }) : x; }); }).then(function () { renderResults(); });
      } else {
        persistTypeListTransform(it.catId, function (fresh) { return fresh.map(function (x) { return x.id === it.id ? Object.assign({}, x, { deletedAt: null }) : x; }); }).then(function () { renderResults(); });
      }
      showToast(it.label + "を元に戻しました");
    }
    function purgeItem(it) {
      if (!confirm("この" + it.label + "を完全に削除します。この操作は元に戻せません。よろしいですか？")) return;
      if (it.kind === "item") {
        persistItemsTransform(function (fresh) { return fresh.filter(function (x) { return x.id !== it.id; }); }).then(function () { renderResults(); });
      } else if (it.kind === "member") {
        persistMembersTransform(function (fresh) { return fresh.filter(function (x) { return x.id !== it.id; }); }).then(function () { renderResults(); });
      } else {
        persistTypeListTransform(it.catId, function (fresh) { return fresh.filter(function (x) { return x.id !== it.id; }); }).then(function () { renderResults(); });
      }
      showToast(it.label + "を完全に削除しました");
    }

    area.querySelectorAll("[data-restore-idx]").forEach(function (btn) {
      btn.addEventListener("click", function () { restoreItem(items[parseInt(btn.getAttribute("data-restore-idx"), 10)]); });
    });
    area.querySelectorAll("[data-purge-idx]").forEach(function (btn) {
      btn.addEventListener("click", function () { purgeItem(items[parseInt(btn.getAttribute("data-purge-idx"), 10)]); });
    });
  }

  function renderConfirm() {
    var root = document.getElementById("modalRoot");
    if (!confirmDeleteId) { root.innerHTML = ""; return; }
    var labelMap = { item: "単価項目", member: "メンバー", typeItem: "項目" };
    root.innerHTML =
      '<div class="modal-overlay" id="confirmOverlay"><div class="confirm-box">' + ICON_ALERT +
      '<h3>この' + labelMap[confirmDeleteId.kind] + 'を削除しますか?</h3><p>ゴミ箱に移動します。後から「ゴミ箱」タブで元に戻せます。</p>' +
      '<div class="confirm-box__actions"><button class="btn btn--ghost btn--sm" id="confirmCancelBtn">キャンセル</button>' +
      '<button class="btn btn--danger-ghost btn--sm" id="confirmDeleteBtn">削除する</button></div></div></div>';
    document.getElementById("confirmOverlay").addEventListener("mousedown", function (e) { if (e.target.id === "confirmOverlay") { confirmDeleteId = null; renderConfirm(); } });
    document.getElementById("confirmCancelBtn").addEventListener("click", function () { confirmDeleteId = null; renderConfirm(); });
    document.getElementById("confirmDeleteBtn").addEventListener("click", function () {
      var delId = confirmDeleteId.id;
      var delKind = confirmDeleteId.kind;
      if (delKind === "item") {
        persistItemsTransform(function (fresh) { return fresh.map(function (it) { return it.id === delId ? Object.assign({}, it, { deletedAt: Date.now() }) : it; }); }).then(function () { renderResults(); });
        showToast("単価項目をゴミ箱に移動しました");
      } else if (delKind === "member") {
        persistMembersTransform(function (fresh) { return fresh.map(function (m) { return m.id === delId ? Object.assign({}, m, { deletedAt: Date.now() }) : m; }); }).then(function () { renderResults(); });
        showToast("メンバーをゴミ箱に移動しました");
      } else {
        var catId = state.activeTypeCategory;
        persistTypeListTransform(catId, function (fresh) { return fresh.map(function (t) { return t.id === delId ? Object.assign({}, t, { deletedAt: Date.now() }) : t; }); }).then(function () { renderResults(); });
        showToast("項目をゴミ箱に移動しました");
      }
      confirmDeleteId = null;
      renderConfirm();
    });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (editModal) closeModal();
      if (confirmDeleteId) { confirmDeleteId = null; renderConfirm(); }
    }
  });

  document.getElementById("searchInput").addEventListener("input", function (e) { state.search = e.target.value; renderResults(); });
  document.getElementById("btnCreate").addEventListener("click", function () {
    if (state.tab === "members") openMemberModal(false, null);
    else if (state.tab === "typeSettings") openTypeModal(false, null);
    else openModal(false, null);
  });
  document.getElementById("btnDeleteAll").addEventListener("click", function () {
    if (state.items.length === 0) { showToast("削除する単価がありません"); return; }
    if (!confirm("単価表に登録されている " + state.items.length + " 件をすべて削除します。\nこの操作は元に戻せません。よろしいですか？")) return;
    persistItems([]);
    showToast("単価表を全件削除しました");
    renderResults();
  });
  document.getElementById("btnImportEstimate").addEventListener("click", function () {
    document.getElementById("importEstimateInput").click();
  });
  document.getElementById("importEstimateInput").addEventListener("change", function () { importEstimateAsPriceItems(this); });

  // ⑪見積・実行予算Proで書き出した見積データ(.json)を読み込み、
  // 工事タブ(cats[].name)＝ジャンル、明細(items[])＝単価候補として単価表に一括登録する。
  // 同じ名称・同じジャンルの単価が既にある場合は上書き更新する。
  function importEstimateAsPriceItems(input) {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var obj = JSON.parse(e.target.result);
        var projectsArr = Array.isArray(obj.projects) ? obj.projects : (obj.cats ? [obj] : null);
        if (!projectsArr) {
          alert("この形式のファイルは読み込めません。⑪見積・実行予算Proで書き出した見積データ(.json)を選んでください。");
          input.value = ""; return;
        }
        var candidates = [];
        projectsArr.forEach(function (proj) {
          (proj.cats || []).forEach(function (cat) {
            (cat.items || []).forEach(function (it) {
              if (!it || !it.name) return;
              var costPrice = Number(it.price) || 0;
              if (costPrice <= 0) return;
              var rate = Number(it.rate) || 1;
              candidates.push({
                name: String(it.name).trim(),
                genre: cat.name,
                spec: it.kei || "",
                unit: it.unit || "式",
                costPrice: costPrice,
                sellPrice: Math.round(costPrice * rate)
              });
            });
          });
        });
        if (candidates.length === 0) {
          alert("登録できる単価データが見つかりませんでした。");
          input.value = ""; return;
        }
        if (!confirm(candidates.length + "件の単価候補が見つかりました。ジャンル別に単価表へ登録しますか？\n※同じ名称・同じジャンルの単価が既にある場合は上書き更新されます。")) {
          input.value = ""; return;
        }
        var added = 0, updated = 0;
        persistItemsTransform(function (fresh) {
          var next = fresh.slice();
          candidates.forEach(function (c, i) {
            var idx = next.findIndex(function (x) { return x.genre === c.genre && x.name === c.name; });
            if (idx >= 0) {
              next[idx] = Object.assign({}, next[idx], { spec: c.spec, unit: c.unit, costPrice: c.costPrice, sellPrice: c.sellPrice });
              updated++;
            } else {
              next.push({ id: "u-" + Date.now() + "-" + i, name: c.name, majorCategoryId: "construction", genre: c.genre, spec: c.spec, qty: 1, unit: c.unit, sellPrice: c.sellPrice, costPrice: c.costPrice, coef: "" });
              added++;
            }
          });
          return next;
        }).then(function () {
          showToast("単価表に登録しました（新規" + added + "件・更新" + updated + "件）");
          renderResults();
        });
      } catch (ex) {
        alert("読み込みに失敗しました。正しい見積データファイルか確認してください。\n" + ex.message);
      }
      input.value = "";
    };
    reader.readAsText(file, "UTF-8");
  }

  function setSidebar(open) {
    document.getElementById("sidebar").classList.toggle("is-open", open);
    document.getElementById("shellWrap").classList.toggle("sidebar-open", open);
    document.getElementById("sidebarOverlay").classList.toggle("is-open", open && window.innerWidth <= 960);
  }
  document.getElementById("hamburgerBtn").addEventListener("click", function () {
    setSidebar(!document.getElementById("sidebar").classList.contains("is-open"));
  });
  document.getElementById("sidebarOverlay").addEventListener("click", function () { setSidebar(false); });
  setSidebar(window.innerWidth > 960);

  /* ---------------- 表示/非表示設定(各PCでlocalStorage保存) ---------------- */
  (function applyUiPrefs() {
    var prefs = {};
    try { prefs = JSON.parse(window.localStorage.getItem("taiho_ui_prefs_v1") || "{}"); } catch (e) { prefs = {}; }
    document.querySelectorAll("[data-pref-key]").forEach(function (el) {
      var key = el.getAttribute("data-pref-key");
      if (prefs[key] === false) el.style.display = "none";
    });
  })();

  function init() {
    renderResults();
    var typeKeys = TYPE_SETTINGS_CATEGORIES.map(function (c) { return storageGet(c.key); });
    Promise.all([storageGet(PRICE_ITEMS_KEY), storageGet(UNITS_KEY), storageGet(BIZ_INFO_KEY), storageGet(MEMBERS_KEY)].concat(typeKeys)).then(function (res) {
      var iData = null, uData = null, bData = null, mData = null;
      try { iData = res[0] && res[0].value ? JSON.parse(res[0].value) : null; } catch (e) {}
      try { uData = res[1] && res[1].value ? JSON.parse(res[1].value) : null; } catch (e) {}
      try { bData = res[2] && res[2].value ? JSON.parse(res[2].value) : null; } catch (e) {}
      try { mData = res[3] && res[3].value ? JSON.parse(res[3].value) : null; } catch (e) {}
      state.items = Array.isArray(iData) ? iData : seedPriceItems();
      state.units = Array.isArray(uData) ? uData : seedUnits();
      state.bizInfo = bData && typeof bData === "object" ? bData : seedBizInfo();
      state.members = Array.isArray(mData) ? mData : seedMembers();
      if (!Array.isArray(iData)) storageSet(PRICE_ITEMS_KEY, JSON.stringify(state.items));
      if (!Array.isArray(uData)) storageSet(UNITS_KEY, JSON.stringify(state.units));
      if (!bData) storageSet(BIZ_INFO_KEY, JSON.stringify(state.bizInfo));
      if (!Array.isArray(mData)) storageSet(MEMBERS_KEY, JSON.stringify(state.members));

      TYPE_SETTINGS_CATEGORIES.forEach(function (c, i) {
        var raw = res[4 + i];
        var data = null;
        try { data = raw && raw.value ? JSON.parse(raw.value) : null; } catch (e) {}
        var list = Array.isArray(data) ? data : seedForCategory(c.id);
        state.typeSettings[c.id] = list;
        if (!Array.isArray(data)) storageSet(c.key, JSON.stringify(list));
      });

      state.loading = false;
      if (state.tab === "priceList") { renderPriceMajorTabs(); renderPriceGenreTabs(); }
      renderResults();
    }).catch(function () {
      state.items = seedPriceItems();
      state.units = seedUnits();
      state.bizInfo = seedBizInfo();
      state.members = seedMembers();
      TYPE_SETTINGS_CATEGORIES.forEach(function (c) { state.typeSettings[c.id] = seedForCategory(c.id); });
      state.loading = false;
      if (state.tab === "priceList") { renderPriceMajorTabs(); renderPriceGenreTabs(); }
      renderResults();
    });
  }

  init();
})();
</script>
</body>
