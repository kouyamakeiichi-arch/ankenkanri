<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="app-build" content="2026-09-14-2" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>現場写真帳 | 太豊建設アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Shippori+Mincho:wght@600;800&family=Oswald:wght@500;600&display=swap">
<style>
  :root{
    --ink:#1c2420;
    --ink-soft:#4c5650;
    --muted:#7a8177;
    --paper:#faf7ee;
    --paper-line:#d8cfb8;
    --surface:#ffffff;
    --shell:#f0ede4;
    --shell-line:#ddd8c9;
    --accent:#c2571c;
    --accent-ink:#7a3510;
    --accent-soft:#f4e2d1;
    --good:#2f6f4e;
    --danger:#b13b2c;
    --shadow: 0 1px 2px rgba(28,36,32,.06), 0 8px 24px -12px rgba(28,36,32,.28);
    --focus: #1c6e5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--shell);
    color:var(--ink);
    font-family:"Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
    overflow-x:hidden;
  }
  ::selection{ background:var(--accent-soft); }
  button{ font-family:inherit; }
  .ce{ outline:none; }
  .ce:empty:before{ content: attr(data-ph); color:var(--muted); font-weight:400; }
  .ce:focus{ box-shadow: 0 0 0 2px var(--focus) inset; border-radius:2px; }

  /* ---------- app shell ---------- */
  #app{ display:flex; flex-direction:column; min-height:100vh; }

  header.topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 18px; background:var(--surface);
    border-bottom:1px solid var(--shell-line);
    position:sticky; top:0; z-index:40;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-right:4px; }
  .brand .mark{ font-family:"Oswald",sans-serif; font-weight:600; font-size:11px; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; }
  .brand .name{ font-family:"Shippori Mincho", serif; font-weight:800; font-size:19px; letter-spacing:.02em; }
  .toolgroup{ display:flex; gap:6px; flex-wrap:wrap; }
  .topbar .spacer{ flex:1 1 auto; }
  .tbtn{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent; border:1px solid var(--shell-line);
    color:var(--ink-soft); padding:7px 12px; border-radius:7px;
    font-size:12.5px; font-weight:500; cursor:pointer;
    text-decoration:none;
    transition:background .12s, border-color .12s, color .12s;
    white-space:nowrap;
  }
  .tbtn:hover{ background:var(--shell); color:var(--ink); }
  .tbtn.primary{ background:var(--accent); border-color:var(--accent); color:#fff8f0; font-weight:600; }
  .tbtn.primary:hover{ filter:brightness(1.06); }
  .tbtn[disabled]{ opacity:.45; cursor:not-allowed; }
  .autosave{ font-size:11.5px; color:var(--muted); min-width:0; text-align:right; white-space:nowrap; }
  .autosave.show{ color:var(--good); }

  .project-select{
    background:var(--surface); color:var(--ink); border:1px solid var(--shell-line);
    border-radius:7px; padding:7px 10px; font-size:12.5px; font-family:inherit;
    max-width:220px;
  }

  .banner{
    display:flex; align-items:center; gap:10px;
    background:var(--accent-soft); color:var(--accent-ink);
    padding:9px 18px; font-size:13px; border-bottom:1px solid var(--paper-line);
  }

  .layout{ flex:1; display:flex; min-height:0; }

  /* ---------- sidebar (ページ一覧) ---------- */
  aside.side{
    width:230px; flex:none; background:var(--surface);
    border-right:1px solid var(--shell-line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .side-section{ padding:12px 12px 4px; }
  .side-label{ font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; padding:6px 4px 8px; }
  .pagecard{
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; margin-bottom:4px; position:relative;
  }
  .pagecard:hover{ background:var(--shell); }
  .pagecard.active{ background:var(--accent-soft); border-color:var(--paper-line); }
  .pagecard .thumb{
    width:34px; height:44px; flex:none; background:var(--paper);
    border:1px solid var(--paper-line); border-radius:2px;
    display:flex; flex-direction:column; gap:2px; padding:3px; overflow:hidden;
  }
  .pagecard .thumb i{ background:var(--shell-line); border-radius:1px; flex:1; display:block; }
  .pagecard.active .thumb i{ background:var(--accent); opacity:.55; }
  .pagecard .meta{ flex:1; min-width:0; }
  .pagecard .t1{ font-size:12.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pagecard .t2{ font-size:11px; color:var(--muted); }
  .pagecard .del{
    opacity:0; background:none; border:none; color:var(--muted); cursor:pointer;
    font-size:15px; padding:2px 4px; border-radius:4px; flex:none;
  }
  .pagecard:hover .del{ opacity:1; }
  .pagecard .del:hover{ color:var(--danger); background:var(--shell); }

  .addpage{ padding:8px 12px 14px; }
  .addpage-title{ font-size:11px; color:var(--muted); margin-bottom:8px; }
  .layout-choice{ display:flex; flex-direction:column; gap:6px; }
  .lchoice{
    display:flex; align-items:center; gap:9px;
    border:1px dashed var(--shell-line); background:transparent;
    padding:7px 9px; border-radius:8px; cursor:pointer; color:var(--ink-soft);
    font-size:12.5px; text-align:left;
  }
  .lchoice:hover{ border-color:var(--accent); color:var(--ink); background:var(--accent-soft); }
  .lchoice .ic{ width:22px; height:26px; flex:none; border:1.4px solid currentColor; border-radius:2px; display:flex; padding:2px; gap:1.5px; }
  .lchoice .ic i{ background:currentColor; opacity:.45; flex:1; border-radius:1px; }
  .ic.i3{ flex-direction:column; }
  .ic.i2{ flex-direction:column; }
  .ic.i4{ flex-wrap:wrap; }
  .ic.i4 i{ width:45%; height:45%; }

  .side-footer{ margin-top:auto; padding:12px; border-top:1px solid var(--shell-line); }
  .stat-row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); padding:2px 0; }
  .stat-row b{ color:var(--ink-soft); font-variant-numeric:tabular-nums; font-weight:600; }
  .stat-row.save b{ color:var(--good); }

  /* ---------- settings drawer ---------- */
  .settings{
    position:fixed; top:0; right:0; height:100vh; width:300px;
    background:var(--surface); border-left:1px solid var(--shell-line);
    box-shadow:var(--shadow); z-index:60; padding:18px;
    transform:translateX(100%); transition:transform .18s ease; overflow-y:auto;
  }
  .settings.open{ transform:translateX(0); }
  .settings h3{ font-size:15px; margin:0 0 4px; font-family:"Shippori Mincho",serif; font-weight:700; }
  .settings .sub{ font-size:12px; color:var(--muted); margin-bottom:16px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field select, .field input[type=range]{ width:100%; }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .switch{ position:relative; width:38px; height:22px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-tog{ position:absolute; inset:0; background:var(--shell-line); border-radius:99px; cursor:pointer; transition:.15s; }
  .slider-tog:before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider-tog{ background:var(--good); }
  .switch input:checked + .slider-tog:before{ transform:translateX(16px); }
  select{
    background:var(--surface); color:var(--ink); border:1px solid var(--shell-line);
    border-radius:6px; padding:6px 8px; font-size:13px;
  }
  input[type=range]{ accent-color:var(--accent); }
  .qualityval{ font-variant-numeric:tabular-nums; color:var(--accent-ink); font-weight:600; }
  .settings-close{ position:absolute; top:14px; right:14px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--muted); }
  .scrim{ position:fixed; inset:0; background:rgba(20,16,10,.28); z-index:55; }

  /* ---------- canvas / sheet area ---------- */
  main.canvas{
    flex:1; overflow:auto; padding:34px 24px 80px;
    display:flex; justify-content:center;
  }
  .empty-hint{ margin:auto; text-align:center; color:var(--muted); font-size:13.5px; max-width:320px; }
  .empty-hint svg{ opacity:.55; margin-bottom:10px; }
  .sheet{
    width:210mm; min-height:297mm; flex:none;
    background:var(--paper); box-shadow:var(--shadow);
    padding:15mm 16mm; position:relative;
    font-family:"Noto Sans JP",sans-serif; color:#1c2420;
    display:flex; flex-direction:column;
  }
  .cap-memo{ overflow:hidden; }
  .sheet, .sheet *{ color:#1c2420; }

  /* cover sheet */
  .cover-title{ text-align:center; margin:18mm 0 20mm; }
  .cover-title .cjp{ font-family:"Shippori Mincho",serif; font-weight:800; font-size:34px; letter-spacing:.5em; padding-left:.5em; border-bottom:2.4px solid #1c2420; display:inline-block; padding-bottom:10px; }
  .cover-frame{ position:absolute; inset:10mm; border-left:2.4px solid #1c2420; pointer-events:none; }
  .cover-rows{ margin-top:24mm; }
  .cover-row{ display:flex; border-bottom:1px solid #8b8272; padding:11px 0 11px 4mm; gap:14px; min-height:20px; }
  .cover-row .lab{ flex:none; width:26mm; font-weight:700; letter-spacing:.28em; font-size:13.5px; }
  .cover-row .val{ flex:1; font-size:14px; }
  .cover-row.period{ align-items:flex-start; }
  .period-sub{ display:flex; flex-direction:column; gap:14px; flex:1; }
  .period-sub .pline{ display:flex; gap:14px; align-items:baseline; }
  .period-sub .plab{ width:16mm; flex:none; font-weight:700; font-size:13px; letter-spacing:.2em; }
  .cover-note{ margin-top:16mm; font-size:11px; color:#7a7261; text-align:center; }

  /* photo sheet header/footer */
  .sheet-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:10.5px; color:#8b8272; border-bottom:1px solid var(--paper-line); padding-bottom:5mm; margin-bottom:5mm; }
  .sheet-head .proj{ font-weight:600; color:#4c5650; }
  .sheet-foot{ position:absolute; left:16mm; right:16mm; bottom:8mm; display:flex; justify-content:space-between; font-size:10px; color:#9c9484; border-top:1px solid var(--paper-line); padding-top:3mm; }

  .grid3{ display:flex; flex-direction:column; gap:5mm; flex:1; }
  .grid2{ display:flex; flex-direction:column; gap:7mm; flex:1; }
  .grid4{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:5mm; flex:1; }

  .slot{ display:flex; gap:4mm; flex:1; min-height:0; }
  .grid4 .slot{ flex-direction:column; }

  .photobox{
    position:relative; flex:1.5; min-width:0; background:#fff;
    border:1px solid var(--paper-line); overflow:hidden;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .grid4 .photobox{ flex:1; }
  .photobox img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photobox.empty{ border-style:dashed; background:#f3efe2; }
  .photobox.uploading{ border-style:dashed; background:#f3efe2; cursor:default; }
  .photobox .placeholder{ display:flex; flex-direction:column; align-items:center; gap:6px; color:#a89f8b; font-size:12px; }
  .photobox .placeholder svg{ width:26px; height:26px; opacity:.7; }
  .photobox .hoverbar{
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:flex-end; gap:4px;
    padding:4px; opacity:0; transition:opacity .12s; background:linear-gradient(rgba(0,0,0,.35),transparent);
  }
  .photobox:hover .hoverbar{ opacity:1; }
  .hoverbar button{
    background:rgba(20,16,10,.66); color:#fff; border:none; border-radius:5px;
    font-size:10.5px; padding:3px 7px; cursor:pointer;
  }
  .hoverbar button:hover{ background:rgba(20,16,10,.85); }
  .badge{
    position:absolute; left:4px; top:4px; background:var(--accent); color:#fff8f0;
    font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:99px; letter-spacing:.03em;
  }

  .capbox{ flex:1; display:flex; flex-direction:column; min-width:0; font-size:11.5px; }
  .grid4 .capbox{ flex:none; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:3px; margin-bottom:4px; }
  .chip{
    font-size:9.5px; border:1px solid var(--paper-line); color:#8b8272; background:#fff;
    padding:1px 6px; border-radius:99px; cursor:pointer;
  }
  .chip:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .cap-category{ font-weight:700; font-size:13px; border-bottom:1.4px solid #1c2420; padding-bottom:3px; margin-bottom:5px; min-height:1.3em; }
  .cap-memo{ flex:1; line-height:1.55; white-space:pre-wrap; min-height:1.4em; }
  .cap-meta{ margin-top:auto; font-size:9.5px; color:#a89f8b; display:flex; flex-direction:column; gap:1px; padding-top:4px; }
  .cap-meta .fn{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cap-meta .dt{ font-variant-numeric:tabular-nums; }

  input.fileinput{ display:none; }

  /* ---------- print ---------- */
  #onlyactive{ display:contents; }
  @media print{
    header.topbar, aside.side, .banner, .settings, .scrim, .addpage, .chip-row, .hoverbar, .badge{ display:none !important; }
    body{ background:#fff; }
    main.canvas{ padding:0; overflow:visible; display:block; }
    .sheet{ box-shadow:none; margin:0 auto; page-break-after:always; height:297mm; min-height:0; }
    .photobox.empty{ border-style:solid; }
  }
  @page{ size:A4; margin:0; }

  @media screen and (max-width: 900px){
    aside.side{ width:180px; }
    .sheet{ zoom:.55; }
    .brand .name{ font-size:16px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="mark">Taiho App</span><span class="name">現場写真帳</span></div>
    <div class="toolgroup">
      <a class="tbtn" href="00_ダッシュボード.html">← 太豊建設アプリ</a>
      <a class="tbtn" href="12_工事完了書ツール.html">工事完了書</a>
      <a class="tbtn" href="13_注文書ツール.html">注文書</a>
    </div>
    <div class="spacer"></div>
    <select class="project-select" id="projectSelect"><option value="">読み込み中...</option></select>
    <span class="autosave" id="autosaveLabel"></span>
    <div class="toolgroup">
      <button class="tbtn" id="btnDownloadJson" disabled>⬇ JSONで保存</button>
      <button class="tbtn" id="btnSettings">⚙ 圧縮設定</button>
      <button class="tbtn primary" id="btnPrint" disabled>🖨 印刷 / PDF</button>
    </div>
  </header>

  <div class="banner" id="noProjectBanner" style="display:none;">
    <span>まず右上のプルダウンから案件を選択してください。①案件管理に登録した案件が表示されます。</span>
  </div>

  <div class="layout">
    <aside class="side" id="sideNav" style="display:none;">
      <div class="side-section">
        <div class="side-label">ページ</div>
      </div>
      <div id="pageList" style="padding:0 8px;"></div>
      <div class="addpage">
        <div class="addpage-title">＋ ページを追加</div>
        <div class="layout-choice">
          <button class="lchoice" data-layout="3up"><span class="ic i3"><i></i><i></i><i></i></span>3枚 / ページ（縦）</button>
          <button class="lchoice" data-layout="2up"><span class="ic i2"><i></i><i></i></span>2枚 / ページ（縦・大きめ）</button>
          <button class="lchoice" data-layout="4up"><span class="ic i4"><i></i><i></i><i></i><i></i></span>4枚 / ページ（2×2）</button>
        </div>
      </div>
      <div class="side-footer">
        <div class="stat-row"><span>写真枚数</span><b id="statCount">0</b></div>
        <div class="stat-row"><span>元サイズ合計</span><b id="statOrig">0 KB</b></div>
        <div class="stat-row"><span>圧縮後サイズ</span><b id="statComp">0 KB</b></div>
        <div class="stat-row save"><span>削減率</span><b id="statSaved">—</b></div>
      </div>
    </aside>

    <main class="canvas" id="canvas">
      <div class="empty-hint" id="emptyHint">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        <div>案件を選択すると、その案件の工事写真帳を作成・編集できます。</div>
      </div>
    </main>
  </div>

  <div class="scrim" id="scrim" style="display:none;"></div>
  <div class="settings" id="settingsPanel">
    <button class="settings-close" id="settingsClose">×</button>
    <h3>写真の自動圧縮</h3>
    <div class="sub">貼り付けた写真をブラウザ内で自動リサイズ・再圧縮してからアップロードし、ファイル容量を抑えます。設定はこれから追加する写真に適用されます。</div>
    <div class="switch-row">
      <label for="compressToggle" style="font-size:13px;font-weight:600;">自動圧縮を有効にする</label>
      <span class="switch"><input type="checkbox" id="compressToggle" checked><span class="slider-tog"></span></span>
    </div>
    <div class="field">
      <label for="maxDim">最大辺のサイズ</label>
      <select id="maxDim">
        <option value="800">800px（小・メール添付向け）</option>
        <option value="1200">1200px</option>
        <option value="1600" selected>1600px（標準）</option>
        <option value="2000">2000px</option>
        <option value="2400">2400px（大・高精細）</option>
      </select>
    </div>
    <div class="field">
      <label for="quality">画質 <span class="qualityval" id="qualityVal">75%</span></label>
      <input type="range" id="quality" min="0.3" max="0.95" step="0.05" value="0.75">
    </div>
    <div class="sub" style="margin-top:-6px;">画質を下げるほどファイルは小さくなりますが、写真は粗くなります。現場記録用途では 70〜80% が目安です。</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     0. ストレージ(Firebase / localStorageフォールバック)
     ============================================================ */
  function storageGet(key) {
    return new Promise(function (resolve) {
      if (window.db) {
        var attempts = 0;
        var tryFetch = function () {
          window.db.collection("taiho_app_data").doc(key).get().then(function (doc) {
            resolve(doc.exists ? { value: doc.data().value } : null);
          }).catch(function () {
            attempts++;
            if (attempts < 3) { setTimeout(tryFetch, attempts * 700); }
            else {
              try { var raw = window.localStorage.getItem(key); resolve(raw ? { value: raw } : null); }
              catch (e) { resolve(null); }
            }
          });
        };
        tryFetch();
      } else {
        try { var raw = window.localStorage.getItem(key); resolve(raw ? { value: raw } : null); }
        catch (e) { resolve(null); }
      }
    });
  }
  function storageSet(key, value) {
    return new Promise(function (resolve) {
      if (window.db) {
        window.db.collection("taiho_app_data").doc(key).set({ value: value, updatedAt: Date.now() }).then(function () {
          resolve({ value: value });
        }).catch(function () {
          try { window.localStorage.setItem(key, value); } catch (e) {}
          resolve({ value: value });
        });
      } else {
        try { window.localStorage.setItem(key, value); } catch (e) {}
        resolve({ value: value });
      }
    });
  }

  var PROJECTS_KEY = "taiho_projects_v2"; // ①案件管理と共通(読み取りのみ)
  var PHOTOBOOK_KEY = "taiho_photobook_v2"; // 案件ごとの工事写真帳(表紙+ページ)をまとめて保存
  var DEFAULT_CONTRACTOR = "有限会社太豊建設";
  var LAYOUT_SLOTS = { "3up": 3, "2up": 2, "4up": 4 };
  var LAYOUT_LABEL = { "3up": "3枚/頁", "2up": "2枚/頁", "4up": "4枚/頁" };
  var CATEGORY_PRESETS = ["施工前", "施工中", "施工後", "安全管理", "使用材料"];

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function escapeHtml(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function eraStr(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00"); if (isNaN(d.getTime())) return "";
    return "R" + (d.getFullYear() - 2018) + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }
  function fmtBytes(n) {
    if (!n) return "0 KB";
    if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }

  function emptySlot() { return { id: uid(), downloadURL: null, storagePath: "", filename: "", date: "", category: "", memo: "", origSize: 0, compSize: 0, uploading: false }; }
  function newPage(layout) {
    var n = LAYOUT_SLOTS[layout] || 3;
    var slots = []; for (var i = 0; i < n; i++) slots.push(emptySlot());
    return { id: uid(), layout: layout, slots: slots };
  }
  function defaultDoc(projectId, proj) {
    return {
      projectId: projectId,
      cover: {
        number: proj && proj.no != null ? String(proj.no) : "",
        name: proj ? (proj.name || "") : "",
        location: "",
        start: proj && proj.startDate ? eraStr(proj.startDate) : "",
        complete: proj && proj.completionDate ? eraStr(proj.completionDate) : "",
        contractor: DEFAULT_CONTRACTOR
      },
      pages: [newPage("3up")],
      settings: { compress: true, maxDim: 1600, quality: 0.75 },
      updatedAt: null
    };
  }

  /* ============================================================
     1. 状態
     ============================================================ */
  var projects = [];
  var docsCache = []; // storageから読み込んだ全案件分の写真帳(read-merge-write用)
  var activeProjectId = "";
  var doc = null; // 現在編集中の案件の写真帳
  var activePageIndex = -1; // -1 = 表紙
  var pendingSlot = null; // {pageId, slotIndex}

  function $(id) { return document.getElementById(id); }

  function findDoc(projectId) {
    return docsCache.filter(function (d) { return d.projectId === projectId; })[0] || null;
  }

  var saveTimer = null;
  function scheduleSave() {
    if (!doc) return;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 550);
  }
  function persist() {
    if (!doc) return;
    doc.updatedAt = Date.now();
    var toSave = JSON.parse(JSON.stringify(doc));
    storageGet(PHOTOBOOK_KEY).then(function (res) {
      var arr = null;
      try { arr = res && res.value ? JSON.parse(res.value) : null; } catch (e) { arr = null; }
      if (!Array.isArray(arr)) arr = docsCache;
      var idx = arr.findIndex(function (d) { return d.projectId === toSave.projectId; });
      if (idx >= 0) arr[idx] = toSave; else arr.push(toSave);
      docsCache = arr;
      return storageSet(PHOTOBOOK_KEY, JSON.stringify(arr));
    }).then(function () { flashAutosave(); }).catch(function () { flashAutosave(); });
  }
  function flashAutosave() {
    var el = $("autosaveLabel");
    el.textContent = "自動保存済み"; el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); el.textContent = ""; }, 1600);
  }

  /* ============================================================
     2. 案件セレクター
     ============================================================ */
  function renderProjectSelect() {
    var sel = $("projectSelect");
    if (!projects.length) {
      sel.innerHTML = '<option value="">案件がありません</option>';
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.innerHTML = '<option value="">案件を選択してください</option>' +
      projects.map(function (p) { return '<option value="' + esc(p.id) + '"' + (p.id === activeProjectId ? " selected" : "") + '>' + esc(p.name || "(無題の案件)") + '</option>'; }).join("");
  }
  $("projectSelect").addEventListener("change", function (e) { selectProject(e.target.value); });

  function selectProject(projectId) {
    activeProjectId = projectId;
    try { history.replaceState(null, "", location.pathname + (activeProjectId ? "?project=" + encodeURIComponent(activeProjectId) : "")); } catch (ex) {}
    renderProjectSelect();
    if (!activeProjectId) {
      doc = null;
      $("noProjectBanner").style.display = "flex";
      $("sideNav").style.display = "none";
      $("btnPrint").disabled = true;
      $("btnDownloadJson").disabled = true;
      $("canvas").innerHTML = '<div class="empty-hint" id="emptyHint"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><div>案件を選択すると、その案件の工事写真帳を作成・編集できます。</div></div>';
      return;
    }
    var proj = projects.filter(function (p) { return p.id === activeProjectId; })[0] || null;
    var existing = findDoc(activeProjectId);
    doc = existing ? existing : defaultDoc(activeProjectId, proj);
    activePageIndex = -1;
    $("noProjectBanner").style.display = "none";
    $("sideNav").style.display = "flex";
    $("btnPrint").disabled = false;
    $("btnDownloadJson").disabled = false;
    render();
  }

  /* ============================================================
     3. サイドバー(ページ一覧)
     ============================================================ */
  function renderSidebar() {
    var list = $("pageList");
    list.innerHTML = "";

    var cover = document.createElement("div");
    cover.className = "pagecard" + (activePageIndex === -1 ? " active" : "");
    cover.innerHTML = '<div class="thumb"><i style="flex:none;height:30%;"></i></div>' +
      '<div class="meta"><div class="t1">表紙</div><div class="t2">' + escapeHtml(doc.cover.name || "工事名未入力") + '</div></div>';
    cover.addEventListener("click", function () { activePageIndex = -1; render(); });
    list.appendChild(cover);

    doc.pages.forEach(function (pg, idx) {
      var filled = pg.slots.filter(function (s) { return s.downloadURL; }).length;
      var card = document.createElement("div");
      card.className = "pagecard" + (activePageIndex === idx ? " active" : "");
      var thumbInner = pg.slots.map(function () { return "<i></i>"; }).join("");
      card.innerHTML = '<div class="thumb">' + thumbInner + '</div>' +
        '<div class="meta"><div class="t1">' + (idx + 1) + 'ページ目・' + LAYOUT_LABEL[pg.layout] + '</div>' +
        '<div class="t2">' + filled + ' / ' + pg.slots.length + ' 枚</div></div>' +
        '<button class="del" title="このページを削除" data-del="' + idx + '">×</button>';
      card.addEventListener("click", function (e) {
        if (e.target.closest(".del")) return;
        activePageIndex = idx; render();
      });
      card.querySelector(".del").addEventListener("click", function (e) {
        e.stopPropagation();
        if (doc.pages.length <= 1) { alert("これ以上ページを削除できません（最低1ページ必要です）。"); return; }
        if (!confirm((idx + 1) + "ページ目を削除しますか？中の写真も削除されます。")) return;
        doc.pages.splice(idx, 1);
        if (activePageIndex >= doc.pages.length) activePageIndex = doc.pages.length - 1;
        scheduleSave(); render();
      });
      list.appendChild(card);
    });

    document.querySelectorAll(".lchoice").forEach(function (btn) {
      btn.onclick = function () {
        doc.pages.push(newPage(btn.getAttribute("data-layout")));
        activePageIndex = doc.pages.length - 1;
        scheduleSave(); render();
      };
    });

    var count = 0, orig = 0, comp = 0;
    doc.pages.forEach(function (pg) { pg.slots.forEach(function (s) {
      if (s.downloadURL) { count++; orig += s.origSize || 0; comp += s.compSize || 0; }
    }); });
    $("statCount").textContent = count;
    $("statOrig").textContent = fmtBytes(orig);
    $("statComp").textContent = fmtBytes(comp);
    $("statSaved").textContent = orig ? Math.round((1 - comp / orig) * 100) + "% 削減" : "—";
  }

  /* ============================================================
     4. キャンバス(表紙・写真ページ)
     ============================================================ */
  function ceAttrs(ph) { return 'contenteditable="true" data-ph="' + ph + '"'; }
  function bindCE(el, onInput) {
    el.addEventListener("input", onInput);
    el.addEventListener("blur", onInput);
  }

  function renderCover() {
    var c = doc.cover;
    var wrap = document.createElement("div");
    wrap.className = "sheet";
    wrap.innerHTML =
      '<div class="cover-frame"></div>' +
      '<div class="cover-title"><span class="cjp">現　場　写　真　帳</span></div>' +
      '<div class="cover-rows">' +
        coverRow("工事番号", "number", c.number, "例：R7-014") +
        coverRow("工事名", "name", c.name, "工事名を入力") +
        coverRow("工事箇所", "location", c.location, "工事箇所を入力") +
        '<div class="cover-row period"><div class="lab">工　期</div><div class="period-sub">' +
          periodLine("着手", "start", c.start) +
          periodLine("竣工", "complete", c.complete) +
        '</div></div>' +
        coverRow("工事施工者", "contractor", c.contractor, "施工者名を入力") +
      '</div>' +
      '<div class="cover-note">太豊建設アプリ 現場写真帳</div>';
    $("canvas").appendChild(wrap);

    ["number", "name", "location", "contractor"].forEach(function (key) {
      var el = wrap.querySelector('[data-field="' + key + '"]');
      bindCE(el, function () { c[key] = el.textContent; renderSidebarLite(); scheduleSave(); });
    });
    ["start", "complete"].forEach(function (key) {
      var el = wrap.querySelector('[data-field="' + key + '"]');
      bindCE(el, function () { c[key] = el.textContent; scheduleSave(); });
    });
  }
  function coverRow(label, key, val, ph) {
    return '<div class="cover-row"><div class="lab">' + label + '</div>' +
      '<div class="val ce" data-field="' + key + '" ' + ceAttrs(ph) + '>' + escapeHtml(val) + '</div></div>';
  }
  function periodLine(label, key, val) {
    return '<div class="pline"><div class="plab">' + label + '</div>' +
      '<div class="val ce" data-field="' + key + '" ' + ceAttrs("例：R8年4月10日") + '>' + escapeHtml(val) + '</div></div>';
  }
  function renderSidebarLite() {
    var t2 = document.querySelector('.pagecard .t2');
    if (activePageIndex === -1 && t2) t2.textContent = doc.cover.name || "工事名未入力";
  }

  function renderPhotoPage(pg, idx) {
    var wrap = document.createElement("div");
    wrap.className = "sheet";
    var gridClass = pg.layout === "3up" ? "grid3" : pg.layout === "2up" ? "grid2" : "grid4";
    wrap.innerHTML =
      '<div class="sheet-head"><span class="proj">' + escapeHtml(doc.cover.name || "（工事名未設定）") + '</span><span>' + escapeHtml(doc.cover.number || "") + '</span></div>' +
      '<div class="' + gridClass + '"></div>' +
      '<div class="sheet-foot"><span>' + escapeHtml(doc.cover.location || "") + '</span><span>' + (idx + 1) + ' / ' + doc.pages.length + ' ページ</span></div>';
    var grid = wrap.querySelector("." + gridClass);
    pg.slots.forEach(function (slot, si) { grid.appendChild(renderSlot(pg, slot, si)); });
    $("canvas").appendChild(wrap);
  }

  function renderSlot(pg, slot, si) {
    var el = document.createElement("div");
    el.className = "slot";

    var photobox = document.createElement("div");
    photobox.className = "photobox" + (slot.uploading ? " uploading" : (slot.downloadURL ? "" : " empty"));
    if (slot.uploading) {
      photobox.innerHTML = '<div class="placeholder"><span>アップロード中…</span></div>';
    } else if (slot.downloadURL) {
      photobox.innerHTML = '<img src="' + esc(slot.downloadURL) + '" alt="">' +
        '<div class="hoverbar"><button data-act="change">変更</button><button data-act="remove">削除</button></div>';
      photobox.querySelector('[data-act="change"]').addEventListener("click", function (e) { e.stopPropagation(); triggerPick(pg.id, si); });
      photobox.querySelector('[data-act="remove"]').addEventListener("click", function (e) {
        e.stopPropagation();
        if (!confirm("この写真を削除しますか？")) return;
        removePhoto(pg, slot, si);
      });
    } else {
      photobox.innerHTML = '<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.4"/></svg><span>クリックして写真を追加</span></div>';
      photobox.addEventListener("click", function () { triggerPick(pg.id, si); });
    }
    el.appendChild(photobox);

    var cap = document.createElement("div");
    cap.className = "capbox";
    var chips = CATEGORY_PRESETS.map(function (c) { return '<button class="chip" data-c="' + c + '">' + c + '</button>'; }).join("");
    cap.innerHTML =
      '<div class="chip-row">' + chips + '</div>' +
      '<div class="cap-category ce" ' + ceAttrs("工程（例：施工前）") + '>' + escapeHtml(slot.category) + '</div>' +
      '<div class="cap-memo ce" ' + ceAttrs("摘要・撮影メモ") + '>' + escapeHtml(slot.memo) + '</div>' +
      '<div class="cap-meta">' +
        '<span class="fn">' + escapeHtml(slot.filename || "") + '</span>' +
        '<span class="dt ce" ' + ceAttrs("撮影日") + '>' + escapeHtml(slot.date || "") + '</span>' +
        (slot.downloadURL ? '<span>' + fmtBytes(slot.origSize) + ' → ' + fmtBytes(slot.compSize) + '</span>' : '') +
      '</div>';
    el.appendChild(cap);

    var catEl = cap.querySelector(".cap-category");
    var memoEl = cap.querySelector(".cap-memo");
    var dateEl = cap.querySelector(".dt");
    bindCE(catEl, function () { slot.category = catEl.textContent; scheduleSave(); });
    bindCE(memoEl, function () { slot.memo = memoEl.textContent; scheduleSave(); });
    bindCE(dateEl, function () { slot.date = dateEl.textContent; scheduleSave(); });
    cap.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () { catEl.textContent = chip.getAttribute("data-c"); slot.category = catEl.textContent; scheduleSave(); });
    });

    return el;
  }

  function removePhoto(pg, slot, si) {
    var oldPath = slot.storagePath;
    pg.slots[si] = emptySlot();
    scheduleSave(); render();
    if (oldPath && window.fbStorage) {
      try { window.fbStorage.ref().child(oldPath).delete().catch(function () {}); } catch (e) {}
    }
  }

  function render() {
    if (!doc) return;
    renderSidebar();
    var canvas = $("canvas");
    canvas.innerHTML = "";
    if (activePageIndex === -1) renderCover();
    else renderPhotoPage(doc.pages[activePageIndex], activePageIndex);
    applySettingsToUI();
  }

  function renderAllForPrint() {
    if (!doc) return;
    var canvas = $("canvas");
    canvas.innerHTML = "";
    renderCover();
    doc.pages.forEach(function (pg, idx) { renderPhotoPage(pg, idx); });
  }
  window.addEventListener("beforeprint", renderAllForPrint);
  window.addEventListener("afterprint", render);

  /* ============================================================
     5. 写真の追加(自動圧縮 + Firebase Storageアップロード)
     ============================================================ */
  var fileInput = document.createElement("input");
  fileInput.type = "file"; fileInput.accept = "image/*"; fileInput.className = "fileinput";
  document.body.appendChild(fileInput);

  function triggerPick(pageId, slotIndex) {
    pendingSlot = { pageId: pageId, slotIndex: slotIndex };
    fileInput.value = "";
    fileInput.click();
  }
  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file || !pendingSlot) return;
    processImage(file, pendingSlot.pageId, pendingSlot.slotIndex);
  });

  function processImage(file, pageId, slotIndex) {
    var pg = doc.pages.find(function (p) { return p.id === pageId; });
    if (!pg) return;
    var slot = pg.slots[slotIndex];
    slot.uploading = true;
    render();

    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var maxDim = doc.settings.maxDim;
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = doc.settings.compress ? Math.min(1, maxDim / Math.max(w, h)) : 1;
      var tw = Math.round(w * scale), th = Math.round(h * scale);

      function finishWithBlob(blob) {
        URL.revokeObjectURL(url);
        var storagePath = "sitephotos/" + doc.projectId + "/" + pg.id + "/" + slot.id + ".jpg";
        if (window.fbStorage) {
          window.fbStorage.ref().child(storagePath).put(blob, { contentType: "image/jpeg" }).then(function (task) {
            return task.ref.getDownloadURL();
          }).then(function (downloadURL) {
            applyUploadResult(slot, downloadURL, storagePath, file, blob.size);
          }).catch(function () {
            // Storageに失敗した場合はdataURLとして直接埋め込む(端末内のみ・オフライン対応)
            embedAsDataUrl(blob, slot, file);
          });
        } else {
          embedAsDataUrl(blob, slot, file);
        }
      }
      function embedAsDataUrl(blob, slot, file) {
        var reader = new FileReader();
        reader.onload = function () { applyUploadResult(slot, reader.result, "", file, blob.size); };
        reader.readAsDataURL(blob);
      }

      if (doc.settings.compress) {
        var canvas = document.createElement("canvas");
        canvas.width = tw; canvas.height = th;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, tw, th);
        canvas.toBlob(function (blob) { finishWithBlob(blob || file); }, "image/jpeg", doc.settings.quality);
      } else {
        finishWithBlob(file);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      slot.uploading = false; render();
      alert("画像を読み込めませんでした。別のファイルをお試しください。");
    };
    img.src = url;
  }

  function applyUploadResult(slot, downloadURL, storagePath, file, compSize) {
    slot.downloadURL = downloadURL;
    slot.storagePath = storagePath;
    slot.filename = file.name;
    slot.origSize = file.size;
    slot.compSize = compSize;
    slot.uploading = false;
    if (!slot.date) {
      var d = new Date(file.lastModified || Date.now());
      slot.date = d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
    }
    scheduleSave();
    render();
  }

  /* ============================================================
     6. ツールバー(JSON保存・印刷・圧縮設定)
     ============================================================ */
  $("btnDownloadJson").addEventListener("click", function () {
    if (!doc) return;
    var jsonStr = JSON.stringify(doc, null, 2);
    var name = (doc.cover.name || "現場写真帳").replace(/[\\/:*?"<>|]/g, "_") + ".json";
    try {
      var blob = new Blob([jsonStr], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    } catch (e) { alert("この環境ではファイルへの保存ができません。「印刷 / PDF」から出力してください。"); }
  });

  $("btnPrint").addEventListener("click", function () {
    if (!doc) return;
    renderAllForPrint();
    setTimeout(function () { window.print(); }, 60);
  });

  var settingsPanel = $("settingsPanel");
  var scrim = $("scrim");
  function openSettings() { settingsPanel.classList.add("open"); scrim.style.display = "block"; }
  function closeSettings() { settingsPanel.classList.remove("open"); scrim.style.display = "none"; }
  $("btnSettings").addEventListener("click", openSettings);
  $("settingsClose").addEventListener("click", closeSettings);
  scrim.addEventListener("click", closeSettings);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSettings(); });

  $("compressToggle").addEventListener("change", function (e) { if (doc) { doc.settings.compress = e.target.checked; scheduleSave(); } });
  $("maxDim").addEventListener("change", function (e) { if (doc) { doc.settings.maxDim = parseInt(e.target.value, 10); scheduleSave(); } });
  $("quality").addEventListener("input", function (e) {
    if (!doc) return;
    doc.settings.quality = parseFloat(e.target.value);
    $("qualityVal").textContent = Math.round(doc.settings.quality * 100) + "%";
    scheduleSave();
  });
  function applySettingsToUI() {
    if (!doc) return;
    $("compressToggle").checked = doc.settings.compress;
    $("maxDim").value = doc.settings.maxDim;
    $("quality").value = doc.settings.quality;
    $("qualityVal").textContent = Math.round(doc.settings.quality * 100) + "%";
  }

  /* ============================================================
     7. 初期化
     ============================================================ */
  function init() {
    var qp = new URLSearchParams(window.location.search);
    var pid = qp.get("project");

    Promise.all([storageGet(PROJECTS_KEY), storageGet(PHOTOBOOK_KEY)]).then(function (res) {
      try { projects = res[0] && res[0].value ? JSON.parse(res[0].value) : []; } catch (e) { projects = []; }
      try { docsCache = res[1] && res[1].value ? JSON.parse(res[1].value) : []; } catch (e) { docsCache = []; }
      if (!Array.isArray(projects)) projects = [];
      if (!Array.isArray(docsCache)) docsCache = [];
      projects.sort(function (a, b) { return (b.no || 0) - (a.no || 0); });
      renderProjectSelect();
      if (pid && projects.some(function (p) { return p.id === pid; })) {
        selectProject(pid);
      }
    }).catch(function () {
      renderProjectSelect();
    });
  }

  init();
})();
</script>
</body>
</html>
